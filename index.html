    function ensureAudioContext() {
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      if (!audioCtx) {
        audioCtx = new AudioCtor();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(function() {});
      }
      return audioCtx;
    }

    function playTone(freq, duration, type, peakGain, attack, release, filterFreq) {
      if (!bgmEnabled || !freq || freq <= 0) return;
      var ctx = ensureAudioContext();
      if (!ctx) return;

      var now = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();

      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, now);

      var filterNode = null;
      if (filterFreq) {
        filterNode = ctx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.setValueAtTime(filterFreq, now);
      }

      var atk = attack || 0.03;
      var rel = release || Math.max(0.08, duration * 0.6);
      var maxG = peakGain || 0.06;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(maxG, now + atk);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(atk + 0.02, duration + rel));

      osc.connect(gain);
      if (filterNode) {
        gain.connect(filterNode);
        filterNode.connect(ctx.destination);
      } else {
        gain.connect(ctx.destination);
      }

      osc.start(now);
      osc.stop(now + duration + rel + 0.03);
    }

          110.00, 0, 103.83, 0,
          98.00, 0, 82.41, 0,

        filter: 650

    };

    function startBgmLoop() {
      if (bgmTimerId !== null) {
        clearInterval(bgmTimerId);
        bgmTimerId = null;
      }
      if (!bgmEnabled) return;

      var pat = bgmPatterns[currentBgmMood] || bgmPatterns.calm;
      bgmStep = 0;

      var tick = function() {
        if (!bgmEnabled) return;
        var p = bgmPatterns[currentBgmMood] || bgmPatterns.calm;
        var freq = p.notes[bgmStep % p.notes.length];
        if (freq > 0) {
          playTone(freq, p.dur, p.type, p.gain, 0.025, p.dur * 0.7, p.filter);
        }
        bgmStep++;
      };

      tick();
      bgmTimerId = setInterval(tick, pat.intervalMs);
    }

    function setBgmMood(mood) {
      if (!bgmPatterns[mood]) return;
      var changed = currentBgmMood !== mood;
      currentBgmMood = mood;
      if (bgmEnabled && (changed || bgmTimerId === null)) {
        startBgmLoop();
      }
    }

    function toggleBgm() {
      bgmEnabled = !bgmEnabled;
      updateAudioButtonsUI();
      if (bgmEnabled) {
        ensureAudioContext();
        startBgmLoop();
      } else {
        if (bgmTimerId !== null) {
          clearInterval(bgmTimerId);
          bgmTimerId = null;
        }
      }
    }

    function updateAudioButtonsUI() {
      if (bgmEnabled) {
        bgmToggleBtn.textContent = 'BGM：オン';
        bgmToggleBtn.className = 'audio-on';
        bgmToggleBtn.setAttribute('aria-pressed', 'true');
      } else {
        bgmToggleBtn.textContent = 'BGM：オフ';
        bgmToggleBtn.className = 'audio-off';
        bgmToggleBtn.setAttribute('aria-pressed', 'false');
      }

      if (!speechSupported) {
        voiceToggleBtn.textContent = '読み上げ：非対応ブラウザ';
        voiceToggleBtn.disabled = true;
        voiceToggleBtn.className = 'audio-off';
        voiceToggleBtn.setAttribute('aria-pressed', 'false');
        rateSlowBtn.disabled = true;
        rateNormalBtn.disabled = true;
        rateFastBtn.disabled = true;
        return;
      }
      voiceToggleBtn.disabled = false;
      voiceToggleBtn.setAttribute('aria-pressed', speechEnabled ? 'true' : 'false');
      if (speechEnabled) {
        voiceToggleBtn.textContent = '読み上げ：オン';
        voiceToggleBtn.className = 'audio-on';
      } else {
        voiceToggleBtn.textContent = '読み上げ：オフ';
        voiceToggleBtn.className = 'audio-off';
      }

      var map = [
        { mode: 'slow', btn: rateSlowBtn },
        { mode: 'normal', btn: rateNormalBtn },
        { mode: 'fast', btn: rateFastBtn }
      ];
      map.forEach(function(item) {
        var isCurrent = speechRateMode === item.mode;
        item.btn.className = 'rate-btn' + (isCurrent ? ' active' : '');
        item.btn.setAttribute('aria-pressed', isCurrent ? 'true' : 'false');
      });
    }

    function setSpeechRate(mode) {
      if (!speechRateMap[mode]) return;
      speechRateMode = mode;
      updateAudioButtonsUI();
      if (speechEnabled && speechSupported) {
        stopSpeech();
        speakText('読み上げ速度を' + speechRateMap[mode].label + 'に設定しました。');
      }
    }

    function stopSpeech() {
      if (!speechSupported) return;
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }

    function speakText(rawText) {
      if (!speechEnabled || !speechSupported || !rawText) return;
      try {
        var cleaned = rawText.replace(/[=\-【】]/g, '').trim();
        if (!cleaned) return;
        var utterance = new SpeechSynthesisUtterance(cleaned);
        utterance.lang = 'ja-JP';
        utterance.rate = speechRateMap[speechRateMode].rate;
        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    function toggleSpeech() {
      if (!speechSupported) return;
      speechEnabled = !speechEnabled;
      updateAudioButtonsUI();
      if (!speechEnabled) {
        stopSpeech();
      } else {
        speakText('音声読み上げをオンにしました。');
      }
    }

    function clearLog() {
      stopSpeech();
      logEl.innerHTML = '';
    }

    function addActionHint(hintText) {
      addLog('操作案内：' + hintText, 'action-hint-log');
    }

    function goToSetupScreen() {
      ensureAudioContext();
      setBgmMood('calm');
      screenState = 'playing';
      openingScreenEl.style.display = 'none';
      gameScreenEl.style.display = 'block';
      updateAudioButtonsUI();
      playerNameInput.focus();
      speakText('名前と肩書きを入力して、ゲームを始めるボタンを押してください。');
    }

    function returnToOpeningScreen() {
      stopSpeech();
      setBgmMood('calm');
      screenState = 'opening';
      gameScreenEl.style.display = 'none';
      openingScreenEl.style.display = 'block';
      returnBannerEl.style.display = 'none';
      rosterSectionEl.style.display = 'none';
      setupAreaEl.style.display = 'flex';
      logEl.innerHTML = '';
      controlsEl.innerHTML = '<button id="start-btn" type="button" onclick="prepareTutorialChoice()">ゲームを始める</button>';
      statusEl.textContent = '準備画面：名前と肩書きを入力して開始してください';
      openingScreenEl.focus();
    }

    openingEnterBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      goToSetupScreen();
    });

    openingScreenEl.addEventListener('click', function() {
      goToSetupScreen();
    });

    gameScreenEl.addEventListener('click', function(e) {
      if (screenState === 'ended') {
        if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
          returnToOpeningScreen();
        }
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.isComposing) return;
      if (e.key === 'Enter' || e.keyCode === 13) {
        if (screenState === 'opening') {
          e.preventDefault();
          goToSetupScreen();
        } else if (screenState === 'ended') {
          var tag = document.activeElement ? document.activeElement.tagName : '';
          if (tag !== 'BUTTON') {
            e.preventDefault();
            returnToOpeningScreen();
          }
        }
      }
    });

    function addLog(text, type, gestureText, shouldSpeak) {
      if (type === undefined) type = '';
      if (gestureText === undefined) gestureText = '';
      if (shouldSpeak === undefined) shouldSpeak = true;

      var div = document.createElement('div');
      div.className = 'log-entry' + (type ? ' ' + type : '');

      if (gestureText) {
        var gSpan = document.createElement('span');
        gSpan.className = 'gesture';
        gSpan.textContent = '（' + gestureText + '）';
        div.appendChild(gSpan);
      }

      div.appendChild(document.createTextNode(text));
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;

      if (shouldSpeak) {
        speakText(gestureText ? gestureText + ' ' + text : text);
      }
    }

    function updateStatus() {
      var aliveCount = players.filter(function(p) { return p.alive; }).length;
      var me = players[0];
      statusEl.textContent = day + '日目 | 生存者: ' + aliveCount + '人 | ' + me.title + ' ' + me.name + '（役職: ' + me.role + ' / ' + (me.alive ? '生存' : '脱落') + '）';
      renderRosterPanel();
    }

    function renderRosterPanel() {
      rosterSectionEl.style.display = 'block';
      rosterListEl.innerHTML = '';

      players.forEach(function(p) {
        var li = document.createElement('li');
        li.className = 'roster-item' + (p.alive ? '' : ' dead');

        var statusBadge = p.alive ? '【生存】' : '【脱落】';
        var declareBadge = p.declaredSeer ? ' ※占い師と名乗り出ている' : '';
        var roleReveal = screenState === 'ended' ? ' ／ 正体：' + p.role : '';

        var header = document.createElement('div');
        header.className = 'roster-header';
        header.textContent = statusBadge + ' ' + p.title + ' ' + p.name + declareBadge + roleReveal;

        var desc = document.createElement('div');
        desc.className = 'roster-desc';
        desc.textContent = p.isPlayer
          ? 'あなた自身。' + p.bio
          : '性格：' + p.personality.label + ' ／ ' + p.bio;

        li.appendChild(header);
        li.appendChild(desc);
        rosterListEl.appendChild(li);
      });
    }

    function shuffleArray(array) {
      var arr = array.slice();
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function getRandomGesture(npc) {
      var list = npc.personality.gestures;
      return list[Math.floor(Math.random() * list.length)];
    }

    function prepareTutorialChoice() {
      ensureAudioContext();
      setBgmMood('calm');
      clearLog();
      day = 1;
      lastVictimSceneIndex = -1;
      suspicionScores = {};

      var customName = playerNameInput.value.trim();
      var playerName = customName !== '' ? customName : 'あなた';

      var customTitle = playerTitleInput.value.trim();
      var shuffledJobs = shuffleArray(jobPool);
      var playerJob = customTitle !== ''
        ? { title: customTitle, bio: 'この場に居合わせた当事者の一人。' }
        : shuffledJobs[0];

      setupAreaEl.style.display = 'none';

      var roles = shuffleArray(['人狼', '占い師', '村人', '村人', '村人']);
      var availableNpcNames = npcNamePool.filter(function(name) { return name !== playerName; });
      var selectedNpcNames = shuffleArray(availableNpcNames).slice(0, 4);
      var personalityKeys = Object.keys(personalities);

      var meObj = {
        id: 0,
        name: playerName,
        title: playerJob.title,
        bio: playerJob.bio,
        role: roles[0],
        alive: true,
        isPlayer: true,
        personality: null,
        declaredSeer: false,
        lastSeerResult: null
      };

      var npcObjs = selectedNpcNames.map(function(name, idx) {
        var job = shuffledJobs[idx + 1];
        var pKey = personalityKeys[Math.floor(Math.random() * personalityKeys.length)];
        return {
          id: idx + 1,
          name: name,
          title: job.title,
          bio: job.bio,
          role: roles[idx + 1],
          alive: true,
          isPlayer: false,
          personality: personalities[pKey],
          declaredSeer: false,
          lastSeerResult: null
        };
      });

      players = [meObj].concat(npcObjs);
      statusEl.textContent = '準備完了 | ' + playerName + '（' + playerJob.title + '）';

      addLog('ゲームの操作説明を聞きますか？', 'system');
      addActionHint('「はい」または「いいえ」を押してください。');
      controlsEl.innerHTML =
        '<button type="button" onclick="showTutorialAndStart()">はい</button>' +
        '<button type="button" class="secondary" onclick="beginMainGame()">いいえ</button>';
    }

    function showTutorialAndStart() {
      clearLog();
      var guideText =
        '【「マヤカシ」の進め方】\n' +
        '1. 参加者5人の中に1人だけ【人狼】が紛れています。\n' +
        '2. 【昼】はみんなの言葉や役職の宣言を聞き、怪しいと思う人に投票して1人を追放します。\n' +
        '3. 【夜】は占い師が1人の正体を調べ、人狼が1人を襲撃します。\n' +
        '4. 人狼を全員追放すれば【村人陣営の勝利】、生存する人狼と村人の数が同じになると【人狼陣営の勝利】です。';
      addLog(guideText, 'guide-msg');
      addActionHint('「説明を読んでゲームを始める」を押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="beginMainGame()">説明を読んでゲームを始める</button>';
    }

    function beginMainGame() {
      setBgmMood('calm');
      clearLog();
      addLog('『マヤカシ』 - 吹雪によって外界と閉ざされた古い館。この5人の中に、夜な夜な人を襲う【人狼】が1人紛れ込んでいる。', 'system');
      var memberSummary = players.map(function(p) { return p.title + 'の' + p.name; }).join('、');
      addLog('参加者：' + memberSummary, 'system');
      addLog(players[0].title + ' ' + players[0].name + ' の裏の顔（役職）は【' + players[0].role + '】です。（画面下部の参加者名簿で全員の背景を確認できます）', 'system');
      addActionHint('「1日目の昼へ進む」を押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="startDayPhase()">1日目の昼へ進む</button>';
      renderRosterPanel();
    }

    function startDayPhase() {
      if (checkGameOver()) return;
      var aliveCount = players.filter(function(p) { return p.alive; }).length;
      if (day === 1 && aliveCount === players.length) {
        setBgmMood('calm');
      } else {
        setBgmMood('suspense');
      }
      clearLog();
      updateStatus();
      addLog('=== ' + day + '日目の昼（議論フェーズ） ===', 'system');

      players.forEach(function(p) {
        suspicionScores[p.id] = (suspicionScores[p.id] || 0) * 0.5;
      });

      var aliveNPCs = players.filter(function(p) { return p.alive && !p.isPlayer; });
      var aliveAll = players.filter(function(p) { return p.alive; });

      aliveNPCs.forEach(function(npc) {
        var gesture = getRandomGesture(npc);
        var speakerLabel = '【' + npc.title + ' ' + npc.name + '】';

        if (npc.role === '占い師' && !npc.declaredSeer && (day === 1 || Math.random() < 0.8)) {
          npc.declaredSeer = true;
          addLog(speakerLabel + npc.personality.declareLine(), 'declare-msg', gesture);
        } else if (npc.role === '人狼' && !npc.declaredSeer && day <= 2 && Math.random() < 0.45) {
          npc.declaredSeer = true;
          addLog(speakerLabel + npc.personality.declareLine(), 'declare-msg', gesture);
        }

        if (npc.declaredSeer) {
          if (npc.role === '占い師' && npc.lastSeerResult) {
            var target = players.find(function(p) { return p.id === npc.lastSeerResult.targetId; });
            var targetLabel = target.title + 'の' + target.name;
            var line = npc.lastSeerResult.isWolf
              ? npc.personality.reportWolf(targetLabel)
              : npc.personality.reportHuman(targetLabel);
            addLog(speakerLabel + line, 'declare-msg');
            if (npc.lastSeerResult.isWolf) suspicionScores[target.id] += 4;
            else suspicionScores[target.id] -= 2;
          } else if (npc.role === '人狼' && day >= 2) {
            var candidates = aliveAll.filter(function(p) { return p.id !== npc.id; });
            var fakeTarget = candidates[Math.floor(Math.random() * candidates.length)];
            var fakeIsWolf = fakeTarget.role !== '人狼' && Math.random() < 0.6;
            var fTargetLabel = fakeTarget.title + 'の' + fakeTarget.name;
            var fLine = fakeIsWolf
              ? npc.personality.reportWolf(fTargetLabel)
              : npc.personality.reportHuman(fTargetLabel);
            addLog(speakerLabel + fLine, 'declare-msg');
            if (fakeIsWolf) suspicionScores[fakeTarget.id] += 3;
          }
        }
      });

      var declaredSeers = aliveAll.filter(function(p) { return p.declaredSeer; });
      if (declaredSeers.length >= 2) {
        addLog('（占い師と名乗る人が' + declaredSeers.length + '人います。どちらかが嘘をついています）', 'system');
        declaredSeers.forEach(function(s) { suspicionScores[s.id] += 1.5; });
      }

      aliveNPCs.forEach(function(npc) {
        var candidates = aliveAll.filter(function(p) { return p.id !== npc.id; });
        var target = candidates[Math.floor(Math.random() * candidates.length)];
        var gesture = getRandomGesture(npc);
        var speakerLabel = '【' + npc.title + ' ' + npc.name + '】';

        if (npc.role === '人狼') {
          var nonWolves = candidates.filter(function(p) { return p.role !== '人狼'; });
          var scapegoat = nonWolves[Math.floor(Math.random() * nonWolves.length)] || target;
          addLog(speakerLabel + npc.personality.suspectLine(scapegoat.title + 'の' + scapegoat.name), 'suspect-msg', gesture);
          suspicionScores[scapegoat.id] += 1.5;
        } else {
          if (declaredSeers.length >= 2 && !npc.declaredSeer) {
            var suspectSeer = declaredSeers[Math.floor(Math.random() * declaredSeers.length)];
            addLog(speakerLabel + npc.personality.suspectLine(suspectSeer.title + 'の' + suspectSeer.name), 'suspect-msg', gesture);
            suspicionScores[suspectSeer.id] += 1.2;
          } else {
            addLog(speakerLabel + npc.personality.suspectLine(target.title + 'の' + target.name), '', gesture);
            suspicionScores[target.id] += 1.0;
          }
        }
      });

      renderRosterPanel();

      if (players[0].alive) {
        showPlayerDiscussionActions();
      } else {
        addLog(players[0].name + 'は脱落しているため、議論を見守っています。', 'system');
        addActionHint('「投票フェーズへ進む」を押してください。');
        controlsEl.innerHTML = '<button type="button" onclick="executeVote(null)">投票フェーズへ進む</button>';
      }
    }

    function showPlayerDiscussionActions() {
      var me = players[0];
      var speakerLabel = '【' + me.title + ' ' + me.name + '】';
      addLog('--- ' + me.name + 'の発言ターン（投票前の駆け引き） ---', 'system');
      addActionHint('「誰かを怪しいと指摘する」「占い師と名乗り出る」「発言を控えて様子を見る」のいずれかを押してください。');
      controlsEl.innerHTML = '';

      var btnSuspect = document.createElement('button');
      btnSuspect.type = 'button';
      btnSuspect.textContent = '誰かを怪しいと指摘する（議論誘導）';
      btnSuspect.onclick = function() {
        addLog('誰を怪しいと主張しますか？', 'system');
        addActionHint('怪しいと思う人物のボタンを押してください。やり直す場合は「戻る」を押してください。');
        renderButtons(
          players.filter(function(p) { return p.alive && !p.isPlayer; }),
          function(target) {
            addLog(
              speakerLabel + '「みんな聞いてくれ。' + target.title + 'の' + target.name + 'の言動が不自然だ。人狼に違いない。」',
              'suspect-msg',
              '一同を見渡し、力強い口調で訴えかける。'
            );
            suspicionScores[target.id] += 3.2;
            suspicionScores[me.id] += 0.5;
            proceedToVotePhase();
          },
          true
        );
      };
      controlsEl.appendChild(btnSuspect);

      if (!me.declaredSeer) {
        var btnDeclare = document.createElement('button');
        btnDeclare.type = 'button';
        btnDeclare.className = 'declare-btn';
        btnDeclare.textContent = me.role === '占い師'
          ? '【占い師】と名乗り出る'
          : '嘘をついて【占い師】と名乗り出る';
        btnDeclare.onclick = function() {
          me.declaredSeer = true;
          renderRosterPanel();
          addLog(
            speakerLabel + '「私が本物の【占い師】だ。嘘をついている者がいるなら今すぐ名乗り出ろ。」',
            'declare-msg',
            '一歩前に出て、堂々と宣言する。'
          );
          players.filter(function(p) { return p.alive && !p.isPlayer && p.declaredSeer; }).forEach(function(rival) {
            suspicionScores[rival.id] += 2.0;
          });
          if (me.role === '占い師' && me.lastSeerResult) {
            var t = players.find(function(p) { return p.id === me.lastSeerResult.targetId; });
            var r = me.lastSeerResult.isWolf ? '【人狼】' : '【村人（白）】';
            addLog(speakerLabel + '「昨晩、' + t.title + 'の' + t.name + 'を占った結果は' + r + 'だった。」', 'declare-msg');
            if (me.lastSeerResult.isWolf) suspicionScores[t.id] += 4.5;
            else suspicionScores[t.id] -= 2.5;
          } else if (me.role !== '占い師' && day >= 2) {
            askFakeSeerReport();
            return;
          }
          proceedToVotePhase();
        };
        controlsEl.appendChild(btnDeclare);
      } else {
        var btnReport = document.createElement('button');
        btnReport.type = 'button';
        btnReport.className = 'declare-btn';
        btnReport.textContent = '占い結果を報告する';
        btnReport.onclick = function() {
          if (me.role === '占い師' && me.lastSeerResult) {
            var t = players.find(function(p) { return p.id === me.lastSeerResult.targetId; });
            var r = me.lastSeerResult.isWolf ? '【人狼】' : '【村人（白）】';
            addLog(speakerLabel + '「昨晩、' + t.title + 'の' + t.name + 'を占った結果は' + r + 'だった。」', 'declare-msg');
            if (me.lastSeerResult.isWolf) suspicionScores[t.id] += 4.5;
            else suspicionScores[t.id] -= 2.5;
            proceedToVotePhase();
          } else {
            askFakeSeerReport();
          }
        };
        controlsEl.appendChild(btnReport);
      }

      var btnPass = document.createElement('button');
      btnPass.type = 'button';
      btnPass.className = 'secondary';
      btnPass.textContent = '発言を控えて様子を見る';
      btnPass.onclick = function() {
        addLog(speakerLabel + 'は言葉少なに周囲の反応を観察している。', '', '静かに息を潜め、全員の表情を見つめる。');
        proceedToVotePhase();
      };
      controlsEl.appendChild(btnPass);
    }

    function askFakeSeerReport() {
      var me = players[0];
      var speakerLabel = '【' + me.title + ' ' + me.name + '】';
      addLog('【嘘の占い報告】誰について報告しますか？', 'system');
      addActionHint('報告したい相手のボタンを押してください。やり直す場合は「戻る」を押してください。');
      renderButtons(
        players.filter(function(p) { return p.alive && !p.isPlayer; }),
        function(target) {
          controlsEl.innerHTML = '';
          addLog(target.title + 'の' + target.name + 'について、どちらの嘘を報告しますか？', 'system');
          addActionHint('「人狼だと嘘をつく」または「村人だと嘘をつく」を押してください。');
          var btnWolf = document.createElement('button');
          btnWolf.type = 'button';
          btnWolf.textContent = target.title + 'の' + target.name + 'は【人狼】だと嘘をつく';
          btnWolf.onclick = function() {
            addLog(speakerLabel + '「昨晩、' + target.title + 'の' + target.name + 'を占った結果、【人狼】だった。」', 'declare-msg');
            suspicionScores[target.id] += 3.5;
            proceedToVotePhase();
          };
          var btnHuman = document.createElement('button');
          btnHuman.type = 'button';
          btnHuman.className = 'secondary';
          btnHuman.textContent = target.title + 'の' + target.name + 'は【村人】だと嘘をつく';
          btnHuman.onclick = function() {
            addLog(speakerLabel + '「昨晩、' + target.title + 'の' + target.name + 'を占った結果、【村人（白）】だった。」', 'declare-msg');
            suspicionScores[target.id] -= 2.0;
            proceedToVotePhase();
          };
          controlsEl.appendChild(btnWolf);
          controlsEl.appendChild(btnHuman);
        },
        true
      );
    }

    function proceedToVotePhase() {
      setBgmMood('suspense');
      clearLog();
      addLog('=== ' + day + '日目の投票フェーズ ===', 'system');
      addLog('誰を追放しますか？', 'system');
      addActionHint('追放したい人物のボタンを押してください。');
      renderButtons(
        players.filter(function(p) { return p.alive && !p.isPlayer; }),
        function(target) { executeVote(target); }
      );
    }

    function executeVote(playerChoice) {
      setBgmMood('suspense');
      clearLog();
      addLog('=== ' + day + '日目の投票結果 ===', 'system');

      var alivePlayers = players.filter(function(p) { return p.alive; });
      var votes = {};
      alivePlayers.forEach(function(p) { votes[p.id] = 0; });

      if (playerChoice) {
        votes[playerChoice.id]++;
        addLog(players[0].title + ' ' + players[0].name + ' は ' + playerChoice.title + 'の' + playerChoice.name + ' に投票しました。');
      }

      alivePlayers.filter(function(p) { return !p.isPlayer; }).forEach(function(npc) {
        var candidates = alivePlayers.filter(function(p) { return p.id !== npc.id; });
        var choice = candidates[0];

        if (npc.role === '人狼') {
          var nonWolves = candidates.filter(function(p) { return p.role !== '人狼'; });
          if (nonWolves.length > 0) {
            nonWolves.sort(function(a, b) { return (suspicionScores[b.id] || 0) - (suspicionScores[a.id] || 0); });
            choice = nonWolves[0];
          }
        } else {
          candidates.sort(function(a, b) {
            var scoreA = (suspicionScores[a.id] || 0) + Math.random() * 1.5;
            var scoreB = (suspicionScores[b.id] || 0) + Math.random() * 1.5;
            return scoreB - scoreA;
          });
          choice = candidates[0];
        }

        votes[choice.id]++;
        addLog(npc.title + ' ' + npc.name + ' は ' + choice.title + 'の' + choice.name + ' に投票しました。');
      });

      var maxVotes = -1;
      var executed = null;
      for (var id in votes) {
        if (votes[id] > maxVotes) {
          maxVotes = votes[id];
          executed = players.find(function(p) { return p.id == id; });
        }
      }

      executed.alive = false;
      renderRosterPanel();
      addLog('投票の結果（' + maxVotes + '票）、' + executed.title + 'の' + executed.name + ' が追放されました。', 'system');

      if (checkGameOver()) return;
      addActionHint('「夜フェーズへ進む」を押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="startNightPhase()">夜フェーズへ進む</button>';
    }

    function startNightPhase() {
      setBgmMood('night');
      clearLog();
      updateStatus();
      addLog('=== ' + day + '日目の夜フェーズ ===', 'system');
      var me = players[0];

      var npcSeer = players.find(function(p) { return p.alive && !p.isPlayer && p.role === '占い師'; });
      if (npcSeer) {
        var targets = players.filter(function(p) { return p.alive && p.id !== npcSeer.id; });
        var target = targets[Math.floor(Math.random() * targets.length)];
        npcSeer.lastSeerResult = { targetId: target.id, isWolf: target.role === '人狼' };
      }

      if (me.alive && me.role === '占い師') {
        addLog('占い師の能力：誰の正体を占いますか？', 'system');
        addActionHint('占いたい人物のボタンを押してください。');
        renderButtons(
          players.filter(function(p) { return p.alive && !p.isPlayer; }),
          function(target) {
            clearLog();
            addLog('=== ' + day + '日目の夜フェーズ（占い結果） ===', 'system');
            var isWolf = target.role === '人狼';
            me.lastSeerResult = { targetId: target.id, isWolf: isWolf };
            var result = isWolf ? '【人狼】' : '【人狼ではない】';
            addLog('占いの結果、' + target.title + 'の' + target.name + ' は ' + result + ' でした。（翌日の議論で報告できます）', 'declare-msg');
            addActionHint('「夜の出来事へ進む」を押してください。');
            controlsEl.innerHTML = '<button type="button" onclick="wolfAttack()">夜の出来事へ進む</button>';
          }
        );
      } else {
        addLog('静まり返った館の中で、それぞれの夜が更けていく。', 'system');
        addActionHint('「夜の出来事へ進む」を押してください。');
        controlsEl.innerHTML = '<button type="button" onclick="wolfAttack()">夜の出来事へ進む</button>';
      }
    }

    function wolfAttack() {
      setBgmMood('night');
      var wolf = players.find(function(p) { return p.alive && p.role === '人狼'; });
      if (wolf) {
        var targets = players.filter(function(p) { return p.alive && p.role !== '人狼'; });
        if (wolf.isPlayer) {
          clearLog();
          addLog('=== ' + day + '日目の夜フェーズ（襲撃） ===', 'system');
          addLog('人狼の能力：今夜、誰を襲撃しますか？', 'system');
          addActionHint('襲撃したい人物のボタンを押してください。');
          renderButtons(targets, function(target) {
            target.alive = false;
            renderRosterPanel();
            clearLog();
            addLog('=== ' + day + '日目の夜明け ===', 'system');
            addLog('あなたは静かに闇へ紛れ、' + target.title + 'の' + target.name + ' を襲撃しました。', 'system');
            day++;
            if (checkGameOver()) return;
            addActionHint('「' + day + '日目の昼へ進む」を押してください。');
            controlsEl.innerHTML = '<button type="button" onclick="startDayPhase()">' + day + '日目の昼へ進む</button>';
          });
          return;
        } else {
          clearLog();
          addLog('=== ' + day + '日目の夜明け ===', 'system');
          var declaredSeers = targets.filter(function(p) { return p.declaredSeer; });
          var victim = declaredSeers.length > 0 && Math.random() < 0.7
            ? declaredSeers[0]
            : targets[Math.floor(Math.random() * targets.length)];
          victim.alive = false;
          renderRosterPanel();
          addLog(formatVictimDiscovery(victim), 'system');
        }
      }
      day++;
      if (checkGameOver()) return;
      addActionHint('「' + day + '日目の昼へ進む」を押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="startDayPhase()">' + day + '日目の昼へ進む</button>';
    }

    function checkGameOver() {
      var wolves = players.filter(function(p) { return p.alive && p.role === '人狼'; }).length;
      var humans = players.filter(function(p) { return p.alive && p.role !== '人狼'; }).length;

      if (wolves === 0) {
        endGame('人狼は追放され、館に平穏が戻りました。【村人陣営の勝利】です。', 'victory');
        return true;
      }
      if (wolves >= humans) {
        endGame('生き残った人々は人狼の牙に倒れました。【人狼陣営の勝利】です。', 'defeat');
        return true;
      }
      return false;
    }

    function endGame(resultMessage, mood) {
      screenState = 'ended';
      setBgmMood(mood || 'victory');
      clearLog();
      updateStatus();
      addLog('=== 結果発表 ===', 'system');
      addLog(resultMessage, 'system');
      addLog('--- すべての参加者の正体 ---', 'system');
      players.forEach(function(p) {
        addLog(p.title + ' ' + p.name + '：正体は【' + p.role + '】 (' + (p.alive ? '生存' : '脱落') + ')');
      });
      addActionHint('「オープニング画面に戻る」を押すか、Enterキーを押してください。');
      returnBannerEl.style.display = 'block';
      controlsEl.innerHTML = '<button type="button" onclick="returnToOpeningScreen()">オープニング画面に戻る</button>';
    }

    function renderButtons(targetList, callback, allowBack) {
      if (allowBack === undefined) allowBack = false;
      controlsEl.innerHTML = '';
      targetList.forEach(function(target) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = target.title + ' ' + target.name;
        btn.onclick = function() { callback(target); };
        controlsEl.appendChild(btn);
      });
      if (allowBack) {
        var backBtn = document.createElement('button');
        backBtn.type = 'button';
        backBtn.className = 'secondary';
        backBtn.textContent = '戻る';
        backBtn.onclick = function() { showPlayerDiscussionActions(); };
        controlsEl.appendChild(backBtn);
      }
    }

    updateAudioButtonsUI();
  </script>
</body>
</html>
