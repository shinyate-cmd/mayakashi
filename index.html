<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マヤカシ - テキスト人狼ゲーム</title>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.65;
      max-width: 680px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #1a1a2e;
      color: #eaeaea;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0;
    }
    h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 10px;
      color: #ffd369;
    }
    #opening-screen {
      background: #16213e;
      border: 2px solid #4ecca3;
      border-radius: 8px;
      padding: 32px 18px;
      text-align: center;
      cursor: pointer;
      margin-top: 16px;
    }
    .opening-title {
      font-size: 2.2rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: #ffd369;
      margin-bottom: 14px;
    }
    .opening-sub {
      color: #cbd5e1;
      margin-bottom: 20px;
      font-size: 1rem;
    }
    .opening-prompt {
      font-size: 1.05rem;
      font-weight: bold;
      color: #4ecca3;
      margin-bottom: 20px;
    }
    #game-screen {
      display: none;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #444;
    }
    .top-bar.bottom-bar {
      margin-top: 20px;
      margin-bottom: 0;
      padding-top: 12px;
      padding-bottom: 4px;
      border-bottom: none;
      border-top: 1px solid #444;
    }
    .audio-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .rate-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #16213e;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid #334;
    }
    .rate-label {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-right: 2px;
    }
    button.rate-btn {
      padding: 6px 10px;
      font-size: 0.85rem;
      background-color: #334155;
      color: #e2e8f0;
    }
    button.rate-btn.active {
      background-color: #ffd369;
      color: #111827;
      font-weight: bold;
    }
    #status {
      background: #16213e;
      padding: 12px 15px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-weight: bold;
      border-left: 4px solid #e94560;
    }
    #log {
      background: #0f3460;
      padding: 15px;
      border-radius: 5px;
      height: 360px;
      overflow-y: auto;
      margin-bottom: 15px;
      border: 1px solid #334;
    }
    .log-entry {
      margin-bottom: 12px;
      border-bottom: 1px dashed #2a4d7a;
      padding-bottom: 8px;
    }
    .system { color: #ffd369; font-weight: bold; }
    .declare-msg { color: #4ecca3; font-weight: bold; }
    .suspect-msg { color: #ff9a76; }
    .intro-msg { color: #e2e8f0; }
    .ending-msg { color: #fde68a; background: #16213e; padding: 10px 12px; border-radius: 4px; border-left: 3px solid #ffd369; }
    .summary-msg { color: #e0f2fe; background: #16213e; padding: 10px 12px; border-radius: 4px; border-left: 3px solid #38bdf8; white-space: pre-line; }
    .guide-msg { color: #e2e8f0; background: #16213e; padding: 10px; border-radius: 4px; white-space: pre-line; }
    .action-hint-log { color: #93c5fd; font-weight: bold; }
    .gesture {
      color: #a8b2d1;
      font-size: 0.92rem;
      display: block;
      margin-bottom: 2px;
    }
    .setup-box {
      background: #16213e;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .setup-box label {
      font-weight: bold;
      font-size: 0.95rem;
    }
    .setup-box input,
    .setup-box select {
      padding: 8px 10px;
      font-size: 1rem;
      border-radius: 4px;
      border: 1px solid #445;
      background-color: #0f3460;
      color: #fff;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      justify-content: center;
    }
    #game-screen .actions {
      justify-content: flex-start;
    }
    button {
      padding: 11px 18px;
      font-size: 1rem;
      cursor: pointer;
      background-color: #e94560;
      color: white;
      border: none;
      border-radius: 5px;
      min-height: 44px;
      touch-action: manipulation;
    }
    button:hover, button:focus {
      background-color: #ff5c77;
      outline: 2px solid #ffd369;
    }
    button.secondary { background-color: #394867; }
    button.secondary:hover, button.secondary:focus { background-color: #4f628e; }
    button.declare-btn { background-color: #218c74; }
    button.declare-btn:hover, button.declare-btn:focus { background-color: #33d9b2; color: #111; }
    button.audio-on { background-color: #218c74; color: #ffffff; }
    button.audio-off { background-color: #475569; color: #ffffff; }
    #roster-section {
      background: #16213e;
      padding: 15px;
      border-radius: 5px;
      border: 1px solid #334;
    }
    .roster-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .roster-item {
      background: #0f3460;
      padding: 10px 12px;
      border-radius: 4px;
      border-left: 4px solid #4ecca3;
    }
    .roster-item.dead {
      opacity: 0.6;
      border-left-color: #666;
    }
    .roster-header {
      font-weight: bold;
    }
    .roster-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-top: 2px;
    }
    .return-hint {
      margin-top: 15px;
      padding: 12px;
      background: #16213e;
      border: 1px solid #ffd369;
      border-radius: 5px;
      color: #ffd369;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="opening-screen" tabindex="0" role="region" aria-label="マヤカシ タイトル画面">
    <div class="opening-title">マヤカシ</div>
    <div class="opening-sub">閉ざされた館で交錯する言葉と嘘 - 言葉の裏側を見抜くテキスト推理ゲーム</div>
    <div class="opening-prompt">クリック・タップ、または Enter キーを押して進む</div>
    <div id="opening-actions" class="actions">
      <button id="opening-enter-btn" type="button">次へ進む</button>
      <button id="opening-bgm-btn" class="audio-on" type="button" aria-pressed="true">BGM：オン</button>
    </div>
  </div>

  <div id="game-screen" style="display: none;">
    <div id="header-bar" class="top-bar">
      <h1>マヤカシ</h1>
      <div class="audio-controls" role="group" aria-label="音声とBGMの設定">
        <button id="bgm-toggle-btn" class="audio-on" type="button" aria-pressed="true" onclick="toggleBgm()">
          BGM：オン
        </button>
        <button id="voice-toggle-btn" class="audio-off" type="button" aria-pressed="false" onclick="toggleSpeech()">
          読み上げ：オフ
        </button>
        <div class="rate-group" role="group" aria-label="読み上げ速度">
          <span class="rate-label">速度：</span>
          <button id="rate-slow" class="rate-btn" type="button" aria-pressed="false" onclick="setSpeechRate('slow')">遅い</button>
          <button id="rate-normal" class="rate-btn active" type="button" aria-pressed="true" onclick="setSpeechRate('normal')">普通</button>
          <button id="rate-fast" class="rate-btn" type="button" aria-pressed="false" onclick="setSpeechRate('fast')">速い</button>
        </div>
      </div>
    </div>

    <div id="status" aria-live="polite">準備画面：名前と肩書きを入力して開始してください</div>

    <div id="log" role="log" aria-live="polite" aria-label="ゲーム進行ログ"></div>

    <div id="setup-area" class="setup-box">
      <label for="player-name-input">あなたの名前（空欄なら「あなた」）</label>
      <input type="text" id="player-name-input" placeholder="例：タロウ、アリス、探偵など" maxlength="15">

      <label for="player-title-input">あなたの肩書き・職業（空欄ならランダム）</label>
      <input type="text" id="player-title-input" placeholder="例：旅の作家、元刑事、見習い薬師など" maxlength="15">

      <label for="player-gender-select">あなたの声の性別傾向</label>
      <select id="player-gender-select">
        <option value="male">男性</option>
        <option value="female">女性</option>
      </select>

      <label for="player-age-select">あなたの年代傾向</label>
      <select id="player-age-select">
        <option value="youth">青年</option>
        <option value="middle" selected>壮年</option>
        <option value="elder">熟年</option>
      </select>
    </div>

    <div id="controls" class="actions" role="region" aria-label="操作ボタン">
      <button id="start-btn" type="button" onclick="prepareTutorialChoice()">ゲームを始める</button>
    </div>

    <div id="return-banner" class="return-hint" style="display: none;" aria-live="polite">
      ゲーム終了：画面をクリック・タップ、または Enter キーを押すとオープニング画面に戻ります。
    </div>

    <div id="roster-section" role="region" aria-label="参加者名簿" style="display: none;">
      <h2>参加者名簿（背景・状態）</h2>
      <ul id="roster-list" class="roster-list"></ul>
    </div>
  </div>

  <script>
    var TOTAL_PLAYERS = 7;
    var screenState = 'opening';
    var players = [];
    var day = 1;
    var suspicionScores = {};
    var dayStatements = [];
    var storyChronicle = [];
    var pendingVoteTarget = null;
    var pendingEndInfo = null;
    var lastGuardedTargetId = null;
    var speechEnabled = false;
    var speechRateMode = 'normal';
    var lastVictimSceneIndex = -1;
    var lastMaleVoteLineIndex = -1;

    var bgmEnabled = true;
    var currentBgmMood = 'opening';
    var audioCtx = null;
    var bgmTimerId = null;
    var bgmStep = 0;

    var speechRateMap = {
      slow: { rate: 0.8, label: '遅い' },
      normal: { rate: 1.05, label: '普通' },
      fast: { rate: 1.35, label: '速い' }
    };

    var narratorVoiceProfile = {
      pitch: 0.90,
      rateScale: 0.96
    };

    var genderConfig = {
      male: { label: '男性', pitchOffset: -0.18, rateMultiplier: 0.97 },
      female: { label: '女性', pitchOffset: 0.24, rateMultiplier: 1.04 }
    };

    var ageConfig = {
      youth: { label: '青年', pitchOffset: 0.10, rateMultiplier: 1.06 },
      middle: { label: '壮年', pitchOffset: 0.0, rateMultiplier: 1.0 },
      elder: { label: '熟年', pitchOffset: -0.14, rateMultiplier: 0.89 }
    };

    var victimSceneTemplates = [
      function(label) {
        return '吹雪の夜が明け、冷え切った広間で' + label + 'が無惨な姿で発見されました。';
      },
      function(label) {
        return '薄暗い廊下の突き当たりで、' + label + 'が無惨な姿で発見されました。窓ガラスには鋭い爪痕が残っています。';
      },
      function(label) {
        return '燃え尽きた暖炉のそばで、' + label + 'が無惨な姿で発見されました。館の中に不穏な静寂が漂います。';
      },
      function(label) {
        return '夜の気配がまだ残る階段の踊り場で、' + label + 'が無惨な姿で発見されました。誰もが言葉を失っています。';
      },
      function(label) {
        return '重い扉が開かれた食堂の片隅で、' + label + 'が無惨な姿で発見されました。夜の闇が容赦なく牙を剥いたのです。';
      }
    ];

    function formatVictimDiscovery(victim) {
      var label = victim.title + 'の' + victim.name;
      var idx = Math.floor(Math.random() * victimSceneTemplates.length);
      if (victimSceneTemplates.length > 1 && idx === lastVictimSceneIndex) {
        idx = (idx + 1) % victimSceneTemplates.length;
      }
      lastVictimSceneIndex = idx;
      return victimSceneTemplates[idx](label);
    }

    var maleVoteLineTemplates = [
      function(targetLabel) {
        return '「これまでの出来事から推理するに、' + targetLabel + 'が人狼で間違いない。」';
      },
      function(targetLabel) {
        return '「これまでの出来事と発言を照らし合わせれば、' + targetLabel + 'が人狼である可能性が最も高い。」';
      },
      function(targetLabel) {
        return '「どう考えても筋が通らない。' + targetLabel + 'に一票を投じる。」';
      },
      function(targetLabel) {
        return '「迷っている暇はないな。俺は' + targetLabel + 'を人狼と見て投票する。」';
      }
    ];

    function pickMaleVoteLine(targetLabel) {
      var idx = Math.floor(Math.random() * maleVoteLineTemplates.length);
      if (maleVoteLineTemplates.length > 1 && idx === lastMaleVoteLineIndex) {
        idx = (idx + 1) % maleVoteLineTemplates.length;
      }
      lastMaleVoteLineIndex = idx;
      return maleVoteLineTemplates[idx](targetLabel);
    }

    var banishedReactionPools = {
      '人狼': {
        male: [
          {
            gesture: '苦々しく舌打ちをし、鋭い視線を残して席を立つ。',
            line: '「ちっ……詰めが甘かったか。だが、この館の闇は簡単には消えんぞ。」'
          },
          {
            gesture: '低い笑い声を漏らし、不敵な笑みを浮かべながらゆっくりと振り返る。',
            line: '「ふっ、見事な推理だよ。俺の正体にたどり着くとはね……褒めてやろう。」'
          },
          {
            gesture: '奥歯を噛み締め、悔しさを押し殺しながら重い扉へと歩み出す。',
            line: '「くそっ、あと一歩だったのに……人間の嗅覚も侮れないということか。」'
          },
          {
            gesture: '肩をすくめ、諦めたように両手を広げてみせる。',
            line: '「やれやれ、お芝居はここまでか。だが、今夜までによく生き残れたものだな。」'
          }
        ],
        female: [
          {
            gesture: '顔を歪め、悔しさを滲ませながら後ろへと下がる。',
            line: '「くっ……まさかここまで見抜かれていたなんて。覚えてなさいよ！」'
          },
          {
            gesture: '口の端に妖艶な笑みを浮かべ、冷ややかな瞳で一同を見渡す。',
            line: '「ふふっ、大正解よ。あなたたちを欺くのは、とても楽しい時間だったわ。」'
          },
          {
            gesture: '唇を噛み、忌々しそうに視線を逸らして背を向ける。',
            line: '「信じられない……私の嘘が破られるなんて。次はこうはいかないわよ。」'
          },
          {
            gesture: '静かにため息をつき、諦めたように優雅な一礼をする。',
            line: '「あらあら、幕引きの時間が来てしまったみたいね。見事な洞察力だわ。」'
          }
        ]
      },
      '占い師': {
        male: [
          {
            gesture: '深く息を吐き、無念さを押し殺した表情でうなずく。',
            line: '「無念だ……俺の言葉が届かなかったか。頼む、残った者たちで人狼を仕留めてくれ。」'
          },
          {
            gesture: '天を仰ぎ、悔しそうに拳を握りしめる。',
            line: '「俺が本物の占い師だったと、いずれわかるはずだ……どうか嘘に惑わされるな！」'
          },
          {
            gesture: '静かに目を閉じ、残される仲間たちへ最後の言葉を託す。',
            line: '「星のお告げを伝えきれなかったことが心残りだ……皆、真実を見失わないでくれ。」'
          },
          {
            gesture: '苦笑いを浮かべながら、ゆっくりと広間の出口へ向かう。',
            line: '「偽物に負けるとは情けないな……だが、俺が残した占いの手がかりを無駄にするなよ。」'
          }
        ],
        female: [
          {
            gesture: '胸に手を当て、悲しげに目を伏せる。',
            line: '「そんな……私は本当に占い師なのに。どうか残った皆さんで人狼を見つけて！」'
          },
          {
            gesture: '涙をこらえながら、真っ直ぐに一同を見つめて訴える。',
            line: '「私の言葉を信じてもらえなかったのね……お願い、嘘をついている人を見抜いて！」'
          },
          {
            gesture: '静かに首を振り、無念の思いを込めて言葉を紡ぐ。',
            line: '「私がいなくなれば、もう夜の真実を知る術がなくなるわ……どうか気をつけて。」'
          },
          {
            gesture: '寂しげに微笑み、残された人々に祈るように手を合わせる。',
            line: '「残念だわ……でも、私が占った結果だけはどうか覚えておいてくださいね。」'
          }
        ]
      },
      '狩人': {
        male: [
          {
            gesture: '深く息をつき、守れなくなる仲間を案じながら席を立つ。',
            line: '「俺がいなくなれば、夜の護衛が途切れる……頼む、昼のうちに人狼を突き止めてくれ。」'
          },
          {
            gesture: '悔しそうに肩を落とし、残る人々を気遣うように振り返る。',
            line: '「くそっ、これからが俺の腕の見せ所だったのに……皆、今夜は最大限に警戒してくれ！」'
          },
          {
            gesture: '静かに胸を叩き、覚悟を決めた表情で一歩退く。',
            line: '「盾となる役目を果たせず申し訳ない。だが、人狼は必ずこの中にいるぞ。」'
          },
          {
            gesture: '鋭い眼差しで館の闇を見据え、重々しく口を開く。',
            line: '「狩人を失った意味は大きいぞ……明日の夜が来る前に、必ず決着をつけてくれ。」'
          }
        ],
        female: [
          {
            gesture: '静かに手を止め、無念の表情で周囲を見渡す。',
            line: '「私が追放されたら、夜に誰かを守れなくなってしまうわ……どうか気をつけて！」'
          },
          {
            gesture: '悔しそうに唇を噛み、残る仲間たちへ強い視線を送る。',
            line: '「私こそが狩人だったのに……これ以上犠牲者を出さないよう、必ず人狼を見つけてね。」'
          },
          {
            gesture: '悲しげに目を伏せ、静かに背筋を伸ばして扉へ向かう。',
            line: '「みんなを守り抜きたかったわ……私の分まで、どうか生き延びてください。」'
          },
          {
            gesture: '心配そうに周囲を見回し、最後の助言を残す。',
            line: '「今夜からはもう護衛がいないのよ……誰が嘘をついているのか、冷静に見極めて！」'
          }
        ]
      },
      '村人': {
        male: [
          {
            gesture: '肩を落とし、納得のいかない面持ちで一歩退く。',
            line: '「俺じゃない……だが決まってしまった以上、逆らうまい。どうか間違えないでくれよ。」'
          },
          {
            gesture: '両手を広げて潔白を訴えながらも、静かに運命を受け入れる。',
            line: '「参ったな、無実の俺を追放するとは……人狼の思うツボだぞ、目を覚ませ！」'
          },
          {
            gesture: '深くため息をつき、悔しさを滲ませながら広間を後にする。',
            line: '「信じてくれとは言わないが、俺が人間だったことはすぐに証明されるさ。」'
          },
          {
            gesture: '険しい表情で一同を見渡し、重く言葉を落とす。',
            line: '「これで村人が一人減ったわけだ……次は絶対に人も逃すなよ。」'
          }
        ],
        female: [
          {
            gesture: '戸惑いと悲しみの混じった表情で、周囲を見つめる。',
            line: '「えっ、私じゃないのに……悔しいけれど、みなさんの無事を祈っています。」'
          },
          {
            gesture: '不安そうに胸元を押さえ、声を震わせながら振り返る。',
            line: '「どうして私が疑われたの……？ 本当の人狼は、まだこの中にいるのよ！」'
          },
          {
            gesture: '悲しげに首を振り、諦めたように静かにうなずく。',
            line: '「わかりました……でも、私はただの村人です。どうかこれ以上間違えないでください。」'
          },
          {
            gesture: '寂しげな笑みを浮かべ、残された人々に語りかける。',
            line: '「疑心暗鬼になるのも無理はないわね……でも、どうか冷静さを失わないで。」'
          }
        ]

      var pat = bgmPatterns[mood] || bgmPatterns.calm;

      var lastMelFreq = 0;

      var tick = function() {
        if (!bgmEnabled) return;
        var activeMood = currentBgmMood;

        if (activeMood === 'opening') {
          var idx = bgmStep % titlePianoArp.length;
          var pFreq = titlePianoArp[idx];
          var vFreq = titleViolinLead[idx];
          var vDur = titleViolinDur[idx] || 0.85;
          var fFreq = titleFluteMelody[idx];
          var fDur = titleFluteDur[idx] || 0.85;

          if (pFreq > 0) {
            var isRootBeat = idx % 4 === 0;
            playExpressiveInstrument('piano', pFreq, isRootBeat ? 0.95 : 0.55, isRootBeat ? 0.088 : 0.068, 0);
          }
          if (vFreq > 0) {
            playExpressiveInstrument('violin', vFreq, vDur, 0.072, 0.02);
          }
          if (fFreq > 0) {
            playExpressiveInstrument('flute', fFreq, fDur, 0.068, 0.03);
          }
          bgmStep++;
          return;
        }

        if (activeMood === 'ending') {
          var eIdx = bgmStep % endingPianoSeq.length;
          var epFreq = endingPianoSeq[eIdx];
          var evFreq = endingViolinSeq[eIdx];
          var efFreq = endingFluteSeq[eIdx];

          if (epFreq > 0) {
            var eRoot = eIdx % 4 === 0;
            playExpressiveInstrument('piano', epFreq, eRoot ? 1.05 : 0.62, eRoot ? 0.085 : 0.065, 0);
          }
          if (evFreq > 0) {
            playExpressiveInstrument('violin', evFreq, 1.15, 0.068, 0.02);
          }
          if (efFreq > 0) {
            playExpressiveInstrument('flute', efFreq, 1.05, 0.064, 0.04);
          }
          bgmStep++;
          return;
        }

        var cfg = turnMelodyConfigs[activeMood] || turnMelodyConfigs.calm;
        var bIdx = bgmStep % cfg.bassNotes.length;
        var fixedBass = cfg.bassNotes[bIdx];
        var randomMel = pickRandomMelodyNote(cfg.melodyPool, lastMelFreq);
        lastMelFreq = randomMel;

        if (fixedBass > 0) {
          playTone(fixedBass, cfg.bassDur, cfg.bassType, cfg.bassGain, 0.03, cfg.bassDur * 0.75, cfg.filter, 0);
        }

        if (randomMel > 0) {
          var isDespair = activeMood === 'despair';
          playTone(
            randomMel,
            cfg.melodyDur,
            cfg.melodyType,
            cfg.melodyGain,
            isDespair ? 0.015 : 0.025,
            isDespair ? 0.35 : 0.55,
            cfg.filter,
            0

            playTone(randomMel * 1.05946, 0.28, 'sawtooth', 0.038, 0.01, 0.25, 920, 0.03);
          }

    function computeVoiceProfile(speaker) {
      var baseRate = speechRateMap[speechRateMode].rate;

      if (!speaker) {
        return {
          pitch: narratorVoiceProfile.pitch,
          rate: Math.max(0.5, Math.min(2.0, baseRate * narratorVoiceProfile.rateScale))
        };
      }

      var fixed = speaker.voiceProfile || createFixedVoiceProfile(speaker.gender, speaker.age, speaker.personality, speaker.id || 0);
      return {
        pitch: Math.max(0.55, Math.min(1.8, fixed.pitch)),
        rate: Math.max(0.5, Math.min(2.0, baseRate * fixed.rateScale))
      };
    }

    function normalizeSpeechPronunciation(text) {
      return text.replace(/静寂/g, 'せいじゃく');

    function speakText(rawText, speaker) {
      if (!speechEnabled || !speechSupported || !rawText) return;
      try {
        var cleaned = normalizeSpeechPronunciation(
          String(rawText)
            .replace(/[=\-【】「」『』]/g, ' ')
            .replace(/\s+/g, ' ')
        ).trim();
        if (!cleaned) return;
        var profile = computeVoiceProfile(speaker || null);
        var utterance = new SpeechSynthesisUtterance(cleaned);
        utterance.lang = 'ja-JP';
        utterance.pitch = profile.pitch;
        utterance.rate = profile.rate;
        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

      if (gestureText === undefined) gestureText = '';
      if (shouldSpeak === undefined) shouldSpeak = true;
      if (speaker === undefined) speaker = null;

      var div = document.createElement('div');
      div.className = 'log-entry' + (type ? ' ' + type : '');

      if (gestureText) {
        var gSpan = document.createElement('span');
        gSpan.className = 'gesture';
        gSpan.textContent = '（' + gestureText + '）';
        div.appendChild(gSpan);
      }

      div.appendChild(document.createTextNode(text));
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;

      if (shouldSpeak) {
        speakText(gestureText ? gestureText + ' ' + text : text, speaker);
      }
    }

    function updateStatus() {
      var aliveCount = players.filter(function(p) { return p.alive; }).length;
      var me = players[0];
      statusEl.textContent = day + '日目 | 生存者: ' + aliveCount + '/' + players.length + '人 | ' + me.title + ' ' + me.name + '（役職: ' + me.role + ' / ' + (me.alive ? '生存' : '脱落') + '）';
      renderRosterPanel();
    }

    function renderRosterPanel() {
      rosterSectionEl.style.display = 'block';
      rosterListEl.innerHTML = '';

      players.forEach(function(p) {
        var li = document.createElement('li');
        li.className = 'roster-item' + (p.alive ? '' : ' dead');

        var statusBadge = p.alive ? '【生存】' : '【脱落】';
        var declareBadge = p.declaredRole ? ' ※' + p.declaredRole + 'と名乗り出ている' : '';
        var roleReveal = screenState === 'ended' ? ' ／ 正体：' + p.role : '';
        var gLabel = (genderConfig[p.gender] && genderConfig[p.gender].label) || '';
        var aLabel = (ageConfig[p.age] && ageConfig[p.age].label) || '';

        var header = document.createElement('div');
        header.className = 'roster-header';
        header.textContent = statusBadge + ' ' + p.title + ' ' + p.name + declareBadge + roleReveal;

        var desc = document.createElement('div');
        desc.className = 'roster-desc';
        desc.textContent = p.isPlayer
          ? 'あなた自身（' + aLabel + '・' + gLabel + '）。' + p.bio
          : aLabel + '・' + gLabel + ' ／ 性格：' + p.personality.label + ' ／ ' + p.bio;

        li.appendChild(header);
        li.appendChild(desc);
        rosterListEl.appendChild(li);
      });
    }

    function shuffleArray(array) {
      var arr = array.slice();
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return arr;
    }

    function getRandomGesture(npc) {
      var list = npc.personality.gestures;
      return list[Math.floor(Math.random() * list.length)];
    }

    function buildRoleDeckForCount(count) {
      var base = ['人狼', '占い師', '狩人', '村人', '村人', '村人', '村人'];
      if (count > base.length) {
        while (base.length < count) {
          base.push('村人');
        }
      }
      return shuffleArray(base.slice(0, count));
    }

    function prepareTutorialChoice() {
      ensureAudioContext();
      setBgmMood('calm');
      setMainChromePlacement(false);
      clearLog();
      day = 1;
      lastVictimSceneIndex = -1;
      lastMaleVoteLineIndex = -1;
      lastGuardedTargetId = null;
      suspicionScores = {};
      dayStatements = [];
      storyChronicle = [];
      pendingVoteTarget = null;
      pendingEndInfo = null;

      var customName = playerNameInput.value.trim();
      var playerName = customName !== '' ? customName : 'あなた';

      var customTitle = playerTitleInput.value.trim();
      var shuffledJobs = shuffleArray(jobPool);
      var playerJob = customTitle !== ''
        ? { title: customTitle, bio: 'この場に居合わせた当事者の一人。' }
        : shuffledJobs[0];

      var playerGender = playerGenderSelect.value || 'male';
      var playerAge = playerAgeSelect.value || 'middle';

      setupAreaEl.style.display = 'none';

      var roles = buildRoleDeckForCount(TOTAL_PLAYERS);
      var availableProfiles = npcProfiles.filter(function(prof) { return prof.name !== playerName; });
      var selectedProfiles = shuffleArray(availableProfiles).slice(0, TOTAL_PLAYERS - 1);
      var personalityKeys = Object.keys(personalities);

      var meObj = {
        id: 0,
        name: playerName,
        title: playerJob.title,
        bio: playerJob.bio,
        gender: playerGender,
        age: playerAge,
        role: roles[0],
        alive: true,
        isPlayer: true,
        personality: null,
        voiceProfile: createFixedVoiceProfile(playerGender, playerAge, null, 0),
        declaredRole: null,
        lastSeerResult: null
      };

      var npcObjs = selectedProfiles.map(function(prof, idx) {
        var job = shuffledJobs[(idx + 1) % shuffledJobs.length];
        var pKey = personalityKeys[Math.floor(Math.random() * personalityKeys.length)];
        var pObj = personalities[pKey];
        return {
          id: idx + 1,
          name: prof.name,
          title: job.title,
          bio: job.bio,
          gender: prof.gender,
          age: prof.age,
          role: roles[idx + 1],
          alive: true,
          isPlayer: false,
          personality: pObj,
          voiceProfile: createFixedVoiceProfile(prof.gender, prof.age, pObj, idx + 1),
          declaredRole: null,
          lastSeerResult: null
        };
      });

      players = [meObj].concat(npcObjs);
      statusEl.textContent = '準備完了（全' + players.length + '名）| ' + playerName + '（' + playerJob.title + '）';

      addLog('ゲームの操作説明を聞きますか？', 'system');
      addActionHint('はい、または、いいえを押してください。');
      controlsEl.innerHTML =
        '<button type="button" onclick="showTutorialAndStart()">はい</button>' +
        '<button type="button" class="secondary" onclick="beginMainGame()">いいえ</button>';
    }

    function showTutorialAndStart() {
      setMainChromePlacement(false);
      clearLog();
      var guideText =
        '【「マヤカシ」の進め方（全' + TOTAL_PLAYERS + '名・人狼1名／占い師1名／狩人1名／村人4名）】\n' +
        '1. 参加者' + TOTAL_PLAYERS + '人の中に1人だけ【人狼】が紛れ、占い師・狩人・村人がそれぞれの役目を担います。\n' +
        '2. 【昼】はみんなの言葉や役職の宣言を聞き、議論の整理を確認したうえで怪しいと思う人に投票して追放します（同票の最多得票者が複数いる場合は全員追放されます）。\n' +
        '3. 【夜】は占い師が1人の正体を調べ、狩人が1人を護衛し、人狼が1人を襲撃します（護衛された人は襲撃から守られます）。\n' +
        '4. 勝敗が決するまで3日目以降も昼と夜が続き、人狼を追放すれば【村人陣営の勝利】、生存する人狼と村人側の数が同じになると【人狼陣営の勝利】です。';
      addLog(guideText, 'guide-msg');
      addActionHint('説明を読んでゲームを始めるボタンを押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="beginMainGame()">説明を読んでゲームを始める</button>';
    }

    function beginMainGame() {
      setMainChromePlacement(true);
      setBgmMood('calm');
      clearLog();
      addLog('『マヤカシ』 - 吹雪によって外界と閉ざされた古い館。この' + players.length + '人の中に、夜な夜な人を襲う【人狼】が1人紛れ込んでいる。', 'system', '', true, null);
      var memberSummary = players.map(function(p) { return p.title + 'の' + p.name; }).join('、');
      addLog('参加者（' + players.length + '名）：' + memberSummary, 'system', '', true, null);
      addLog(players[0].title + ' ' + players[0].name + ' の裏の顔（役職）は【' + players[0].role + '】です。（画面下部の参加者名簿で全員の背景を確認できます）', 'system', '', true, null);
      addActionHint('全員の自己紹介へ進むボタンを押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="startIntroductions()">全員の自己紹介へ進む</button>';
      renderRosterPanel();
    }

    function startIntroductions() {
      setMainChromePlacement(true);
      setBgmMood('calm');
      clearLog();
      addLog('=== 全員集合：自己紹介（' + players.length + '名） ===', 'system', '', true, null);
      addLog('暖炉の火を囲み、集まった' + players.length + '人が順番に名乗りを上げます。それぞれの声色や話し方に耳を傾けてください。', 'system', '', true, null);

      players.forEach(function(p) {
        var speakerLabel = '【' + p.title + ' ' + p.name + '】';
        if (p.isPlayer) {
          var myIntrosFemale = [
            '「私は' + p.title + 'の' + p.name + 'です。この館で何が起きているのか、落ち着いて見極めたいと思います。」',
            '「' + p.title + 'の' + p.name + 'と申します。吹雪が止むまで、皆さんと協力して真実を探りたいです。」'
          ];
          var myIntrosMale = [
            '「私は' + p.title + 'の' + p.name + 'だ。この館で何が起きているのか、落ち着いて見極めたい。」',
            '「' + p.title + 'の' + p.name + 'と申します。誰が嘘をついているのか、冷静に見極めていきましょう。」'
          ];
          var myPool = p.gender === 'female' ? myIntrosFemale : myIntrosMale;
          var myIntro = myPool[Math.floor(Math.random() * myPool.length)];
          addLog(speakerLabel + myIntro, 'intro-msg', '館の広間で静かに前へ進み出る。', true, p);
        } else {
          var npcIntro = buildNpcIntroLine(p);
          var npcGesture = getRandomGesture(p);
          addLog(speakerLabel + npcIntro, 'intro-msg', npcGesture, true, p);
        }
      });

      addActionHint('1日目の昼へ進むボタンを押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="startDayPhase()">1日目の昼へ進む</button>';
      renderRosterPanel();
    }

    function startDayPhase() {
      setMainChromePlacement(true);
      if (evaluateGameOutcome('other')) {
        return;
      }
      var aliveCount = players.filter(function(p) { return p.alive; }).length;
      if (day === 1 && aliveCount === players.length) {
        setBgmMood('calm');
      } else {
        setBgmMood('suspense');
      }
      clearLog();
      updateStatus();
      dayStatements = [];
      addLog('=== ' + day + '日目の昼（議論フェーズ） ===', 'system', '', true, null);

      players.forEach(function(p) {
        suspicionScores[p.id] = (suspicionScores[p.id] || 0) * 0.5;
      });

      var aliveNPCs = players.filter(function(p) { return p.alive && !p.isPlayer; });
      var aliveAll = players.filter(function(p) { return p.alive; });

      aliveNPCs.forEach(function(npc) {
        var gesture = getRandomGesture(npc);
        var speakerLabel = '【' + npc.title + ' ' + npc.name + '】';

        if (npc.role === '占い師' && !npc.declaredRole && (day === 1 || Math.random() < 0.8)) {
          npc.declaredRole = '占い師';
          addLog(speakerLabel + getPersonaLine(npc.personality, npc.gender, 'declareLine'), 'declare-msg', gesture, true, npc);
          dayStatements.push({
            speaker: npc,
            kind: 'declare',
            target: null,
            summary: npc.title + ' ' + npc.name + 'が【占い師】と名乗り出た'
          });
        } else if (npc.role === '狩人' && !npc.declaredRole && day >= 2 && Math.random() < 0.55) {
          npc.declaredRole = '狩人';
          addLog(speakerLabel + getPersonaLine(npc.personality, npc.gender, 'declareHunterLine'), 'declare-msg', gesture, true, npc);
          dayStatements.push({
            speaker: npc,
            kind: 'declare',
            target: null,
            summary: npc.title + ' ' + npc.name + 'が【狩人】と名乗り出た'
          });
          suspicionScores[npc.id] -= 1.0;
        } else if (npc.role === '人狼' && !npc.declaredRole && day <= 2 && Math.random() < 0.45) {
          npc.declaredRole = '占い師';
          addLog(speakerLabel + getPersonaLine(npc.personality, npc.gender, 'declareLine'), 'declare-msg', gesture, true, npc);
          dayStatements.push({
            speaker: npc,
            kind: 'declare',
            target: null,
            summary: npc.title + ' ' + npc.name + 'が【占い師】と名乗り出た'
          });
        }

        if (npc.declaredRole === '占い師') {
          if (npc.role === '占い師' && npc.lastSeerResult) {
            var target = players.find(function(p) { return p.id === npc.lastSeerResult.targetId; });
            if (target) {
              var targetLabel = target.title + 'の' + target.name;
              var line = npc.lastSeerResult.isWolf
                ? getPersonaLine(npc.personality, npc.gender, 'reportWolf', targetLabel)
                : getPersonaLine(npc.personality, npc.gender, 'reportHuman', targetLabel);
              addLog(speakerLabel + line, 'declare-msg', '', true, npc);
              dayStatements.push({
                speaker: npc,
                kind: npc.lastSeerResult.isWolf ? 'reportWolf' : 'reportHuman',
                target: target,
                summary: npc.title + ' ' + npc.name + 'の占い報告（' + targetLabel + 'は' + (npc.lastSeerResult.isWolf ? '人狼' : '村人側') + '）'
              });
              if (npc.lastSeerResult.isWolf) suspicionScores[target.id] += 4;
              else suspicionScores[target.id] -= 2;
            }
          } else if (npc.role === '人狼' && day >= 2) {
            var candidates = aliveAll.filter(function(p) { return p.id !== npc.id; });
            if (candidates.length > 0) {
              var fakeTarget = candidates[Math.floor(Math.random() * candidates.length)];
              var fakeIsWolf = fakeTarget.role !== '人狼' && Math.random() < 0.6;
              var fTargetLabel = fakeTarget.title + 'の' + fakeTarget.name;
              var fLine = fakeIsWolf
                ? getPersonaLine(npc.personality, npc.gender, 'reportWolf', fTargetLabel)
                : getPersonaLine(npc.personality, npc.gender, 'reportHuman', fTargetLabel);
              addLog(speakerLabel + fLine, 'declare-msg', '', true, npc);
              dayStatements.push({
                speaker: npc,
                kind: fakeIsWolf ? 'reportWolf' : 'reportHuman',
                target: fakeTarget,
                summary: npc.title + ' ' + npc.name + 'の占い報告（' + fTargetLabel + 'は' + (fakeIsWolf ? '人狼' : '村人側') + '）'
              });
              if (fakeIsWolf) suspicionScores[fakeTarget.id] += 3;
            }
          }
        }
      });

      var declaredSeers = aliveAll.filter(function(p) { return p.declaredRole === '占い師'; });
      if (declaredSeers.length >= 2) {
        addLog('（占い師と名乗る人が' + declaredSeers.length + '人います。どちらかが嘘をついています）', 'system', '', true, null);
        declaredSeers.forEach(function(s) { suspicionScores[s.id] += 1.5; });
      }

      aliveNPCs.forEach(function(npc) {
        var candidates = aliveAll.filter(function(p) { return p.id !== npc.id; });
        if (candidates.length === 0) return;
        var target = candidates[Math.floor(Math.random() * candidates.length)];
        var gesture = getRandomGesture(npc);
        var speakerLabel = '【' + npc.title + ' ' + npc.name + '】';

        if (npc.role === '人狼') {
          var nonWolves = candidates.filter(function(p) { return p.role !== '人狼'; });
          var scapegoat = nonWolves[Math.floor(Math.random() * nonWolves.length)] || target;
          addLog(speakerLabel + buildNpcSuspectLine(npc, scapegoat), 'suspect-msg', gesture, true, npc);
          dayStatements.push({
            speaker: npc,
            kind: 'suspect',
            target: scapegoat,
            summary: npc.title + ' ' + npc.name + 'の指摘（' + scapegoat.title + 'の' + scapegoat.name + 'が怪しい）'
          });
          suspicionScores[scapegoat.id] += 1.5;
        } else {
          if (declaredSeers.length >= 2 && npc.declaredRole !== '占い師') {
            var suspectSeer = declaredSeers[Math.floor(Math.random() * declaredSeers.length)];
            addLog(speakerLabel + buildNpcSuspectLine(npc, suspectSeer), 'suspect-msg', gesture, true, npc);
            dayStatements.push({
              speaker: npc,
              kind: 'suspect',
              target: suspectSeer,
              summary: npc.title + ' ' + npc.name + 'の指摘（' + suspectSeer.title + 'の' + suspectSeer.name + 'が怪しい）'
            });
            suspicionScores[suspectSeer.id] += 1.2;
          } else {
            addLog(speakerLabel + buildNpcSuspectLine(npc, target), '', gesture, true, npc);
            dayStatements.push({
              speaker: npc,
              kind: 'suspect',
              target: target,
              summary: npc.title + ' ' + npc.name + 'の指摘（' + target.title + 'の' + target.name + 'が怪しい）'
            });
            suspicionScores[target.id] += 1.0;
          }
        }
      });

      renderRosterPanel();

      if (players[0].alive) {
        showPlayerDiscussionActions();
      } else {
        addLog(players[0].name + 'は脱落しているため発言できません。議論の整理を確認してから投票へ進みましょう。', 'system', '', true, null);
        showDiscussionSummaryPhase();
      }
    }

    function showPlayerDiscussionActions() {
      var me = players[0];
      var speakerLabel = '【' + me.title + ' ' + me.name + '】';
      addLog('--- ' + me.name + 'の発言ターン（投票前の駆け引き） ---', 'system', '', true, null);
      addActionHint('誰かを怪しいと指摘する、意見に賛同または反論する、役職を名乗り出る、様子を見る、から選んでください。');
      controlsEl.innerHTML = '';

      var btnSuspect = document.createElement('button');
      btnSuspect.type = 'button';
      btnSuspect.textContent = '誰かを怪しいと指摘する';
      btnSuspect.onclick = function() {
        addLog('誰を怪しいと主張しますか？', 'system', '', true, null);
        addActionHint('怪しいと思う人物のボタンを押してください。やり直す場合は戻るを押してください。');
        renderButtons(
          players.filter(function(p) { return p.alive && !p.isPlayer; }),
          function(target) {
            var line = me.gender === 'female'
              ? '「みなさん聞いてください。' + target.title + 'の' + target.name + 'の言動が不自然です。人狼に違いありません。」'
              : '「みんな聞いてくれ。' + target.title + 'の' + target.name + 'の言動が不自然だ。人狼に違いない。」';
            addLog(speakerLabel + line, 'suspect-msg', '一同を見渡し、力強い口調で訴えかける。', true, me);
            dayStatements.push({
              speaker: me,
              kind: 'suspect',
              target: target,
              summary: me.title + ' ' + me.name + '（あなた）の指摘（' + target.title + 'の' + target.name + 'が怪しい）'
            });
            suspicionScores[target.id] += 3.2;
            suspicionScores[me.id] += 0.5;
            showDiscussionSummaryPhase();
          },
          true
        );
      };
      controlsEl.appendChild(btnSuspect);

      var aliveStatements = dayStatements.filter(function(st) { return st.speaker && st.speaker.alive && !st.speaker.isPlayer && st.kind !== 'declare'; });
      if (aliveStatements.length > 0) {
        var btnAgree = document.createElement('button');
        btnAgree.type = 'button';
        btnAgree.className = 'secondary';
        btnAgree.textContent = '他の人の意見に賛同する';
        btnAgree.onclick = function() {
          chooseStanceTarget('agree');
        };
        controlsEl.appendChild(btnAgree);

        var btnDisagree = document.createElement('button');
        btnDisagree.type = 'button';
        btnDisagree.className = 'secondary';
        btnDisagree.textContent = '他の人の意見に反論する';
        btnDisagree.onclick = function() {
          chooseStanceTarget('disagree');
        };
        controlsEl.appendChild(btnDisagree);
      }

      if (!me.declaredRole) {
        var btnDeclare = document.createElement('button');
        btnDeclare.type = 'button';
        btnDeclare.className = 'declare-btn';
        if (me.role === '占い師') {
          btnDeclare.textContent = '【占い師】と名乗り出る';
        } else if (me.role === '狩人') {
          btnDeclare.textContent = '【狩人】と名乗り出る';
        } else {
          btnDeclare.textContent = '嘘をついて【占い師】と名乗り出る';
        }
        btnDeclare.onclick = function() {
          var claimRole = me.role === '狩人' ? '狩人' : '占い師';
          me.declaredRole = claimRole;
          renderRosterPanel();
          var line = '';
          if (claimRole === '狩人') {
            line = me.gender === 'female'
              ? '「私が【狩人】です。夜に襲われる人が出ないよう、全力で守ります。」'
              : '「俺が【狩人】だ。夜に襲われる人が出ないよう、しっかり守り抜く。」';
          } else {
            line = me.gender === 'female'
              ? '「私が本物の【占い師】です。嘘をついている方がいるなら今すぐ名乗り出てください。」'
              : '「私が本物の【占い師】だ。嘘をついている者がいるなら今すぐ名乗り出ろ。」';
          }
          addLog(speakerLabel + line, 'declare-msg', '一歩前に出て、堂々と宣言する。', true, me);
          dayStatements.push({
            speaker: me,
            kind: 'declare',
            target: null,
            summary: me.title + ' ' + me.name + '（あなた）が【' + claimRole + '】と名乗り出た'
          });
          if (claimRole === '占い師') {
            players.filter(function(p) { return p.alive && !p.isPlayer && p.declaredRole === '占い師'; }).forEach(function(rival) {
              suspicionScores[rival.id] += 2.0;
            });
            if (me.role === '占い師' && me.lastSeerResult) {
              var t = players.find(function(p) { return p.id === me.lastSeerResult.targetId; });
              if (t) {
                var r = me.lastSeerResult.isWolf ? '【人狼】' : '【村人側（白）】';
                addLog(speakerLabel + '「昨晩、' + t.title + 'の' + t.name + 'を占った結果は' + r + 'でした。」', 'declare-msg', '', true, me);
                dayStatements.push({
                  speaker: me,
                  kind: me.lastSeerResult.isWolf ? 'reportWolf' : 'reportHuman',
                  target: t,
                  summary: me.title + ' ' + me.name + '（あなた）の占い報告（' + t.title + 'の' + t.name + 'は' + (me.lastSeerResult.isWolf ? '人狼' : '村人側') + '）'
                });
                if (me.lastSeerResult.isWolf) suspicionScores[t.id] += 4.5;
                else suspicionScores[t.id] -= 2.5;
              }
            } else if (me.role !== '占い師' && day >= 2) {
              askFakeSeerReport();
              return;
            }
          }
          showDiscussionSummaryPhase();
        };
        controlsEl.appendChild(btnDeclare);
      } else if (me.declaredRole === '占い師') {
        var btnReport = document.createElement('button');
        btnReport.type = 'button';
        btnReport.className = 'declare-btn';
        btnReport.textContent = '占い結果を報告する';
        btnReport.onclick = function() {
          if (me.role === '占い師' && me.lastSeerResult) {
            var t = players.find(function(p) { return p.id === me.lastSeerResult.targetId; });
            if (t) {
              var r = me.lastSeerResult.isWolf ? '【人狼】' : '【村人側（白）】';
              addLog(speakerLabel + '「昨晩、' + t.title + 'の' + t.name + 'を占った結果は' + r + 'でした。」', 'declare-msg', '', true, me);
              dayStatements.push({
                speaker: me,
                kind: me.lastSeerResult.isWolf ? 'reportWolf' : 'reportHuman',
                target: t,
                summary: me.title + ' ' + me.name + '（あなた）の占い報告（' + t.title + 'の' + t.name + 'は' + (me.lastSeerResult.isWolf ? '人狼' : '村人側') + '）'
              });
              if (me.lastSeerResult.isWolf) suspicionScores[t.id] += 4.5;
              else suspicionScores[t.id] -= 2.5;
            }
            showDiscussionSummaryPhase();
          } else {
            askFakeSeerReport();
          }
        };
        controlsEl.appendChild(btnReport);
      }

      var btnPass = document.createElement('button');
      btnPass.type = 'button';
      btnPass.className = 'secondary';
      btnPass.textContent = '発言を控えて様子を見る';
      btnPass.onclick = function() {
        addLog(speakerLabel + 'は言葉少なに周囲の反応を観察している。', '', '静かに息を潜め、全員の表情を見つめる。', true, me);
        dayStatements.push({
          speaker: me,
          kind: 'pass',
          target: null,
          summary: me.title + ' ' + me.name + '（あなた）は発言を控えて様子を見た'
        });
        showDiscussionSummaryPhase();
      };
      controlsEl.appendChild(btnPass);
    }

    function chooseStanceTarget(stanceType) {
      var me = players[0];
      var speakerLabel = '【' + me.title + ' ' + me.name + '】';
      var aliveStatements = dayStatements.filter(function(st) { return st.speaker && st.speaker.alive && !st.speaker.isPlayer && st.kind !== 'declare'; });
      if (aliveStatements.length === 0) {
        showPlayerDiscussionActions();
        return;
      }

      addLog(stanceType === 'agree' ? '誰の意見に賛同しますか？' : '誰の意見に反論しますか？', 'system', '', true, null);
      addActionHint('対象となる発言のボタンを押してください。やり直す場合は戻るを押してください。');
      controlsEl.innerHTML = '';

      aliveStatements.forEach(function(st) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = st.summary;
        btn.onclick = function() {
          var spLabel = st.speaker.title + 'の' + st.speaker.name;
          var tgLabel = st.target ? (st.target.title + 'の' + st.target.name) : '';

          if (stanceType === 'agree') {
            var agreeLine = '';
            var agreeKind = 'agree';
            var agreeTarget = st.target;
            if (st.kind === 'reportHuman' && st.target) {
              agreeLine = me.gender === 'female'
                ? '「' + spLabel + 'の言う通りね。' + tgLabel + 'を信じてみるべきだわ。」'
                : '「' + spLabel + 'の言う通りだ。' + tgLabel + 'の白結果は筋が通っている。」';
              suspicionScores[st.target.id] -= 1.8;
              suspicionScores[st.speaker.id] -= 0.8;
            } else if (st.target) {
              agreeLine = me.gender === 'female'
                ? '「私も' + spLabel + 'の意見に賛成よ。' + tgLabel + 'には怪しいところがあるわ。」'
                : '「俺も' + spLabel + 'の意見に賛成だ。' + tgLabel + 'は怪しいと見て間違いない。」';
              agreeKind = 'suspect';
              suspicionScores[st.target.id] += 2.6;
              suspicionScores[st.speaker.id] -= 0.5;
            } else {
              agreeLine = me.gender === 'female'
                ? '「' + spLabel + 'の意見に賛同します。落ち着いて判断しましょう。」'
                : '「' + spLabel + 'の意見に賛同する。よく考えるべきだ。」';
              suspicionScores[st.speaker.id] -= 0.5;
            }
            addLog(speakerLabel + agreeLine, 'declare-msg', 'うなずきながら賛意を示す。', true, me);
            dayStatements.push({
              speaker: me,
              kind: agreeKind,
              target: agreeTarget,
              summary: me.title + ' ' + me.name + '（あなた）が' + spLabel + 'の意見に賛同した'
            });
          } else {
            var disagreeLine = '';
            if (st.kind === 'reportHuman' && st.target) {
              disagreeLine = me.gender === 'female'
                ? '「待って、' + spLabel + '。' + tgLabel + 'を無条件に信用するのは危険よ！」'
                : '「待てよ、' + spLabel + '。' + tgLabel + 'を簡単に白だと決めつけるのは危ない！」';
              suspicionScores[st.speaker.id] += 2.2;
              suspicionScores[st.target.id] += 1.0;
            } else if (st.target) {
              disagreeLine = me.gender === 'female'
                ? '「それはおかしいわ、' + spLabel + '。' + tgLabel + 'を責める前に、あなた自身の言動こそ怪しいじゃない！」'
                : '「待て、' + spLabel + '。' + tgLabel + 'に罪を着せようとするお前の方が怪しいぞ！」';
              suspicionScores[st.speaker.id] += 2.8;
              suspicionScores[st.target.id] -= 1.2;
            } else {
              disagreeLine = me.gender === 'female'
                ? '「' + spLabel + 'の意見には賛成できないわ。別の視点からも見るべきよ。」'
                : '「' + spLabel + 'の意見には反論する。まだ決めつける段階じゃない。」';
              suspicionScores[st.speaker.id] += 1.8;
            }
            addLog(speakerLabel + disagreeLine, 'suspect-msg', '真っ直ぐに見据え、きっぱりと異議を唱える。', true, me);
            dayStatements.push({
              speaker: me,
              kind: 'disagree',
              target: st.speaker,
              summary: me.title + ' ' + me.name + '（あなた）が' + spLabel + 'の意見に反論した'
            });
          }

          showDiscussionSummaryPhase();
        };
        controlsEl.appendChild(btn);
      });

      var backBtn = document.createElement('button');
      backBtn.type = 'button';
      backBtn.className = 'secondary';
      backBtn.textContent = '戻る';
      backBtn.onclick = function() { showPlayerDiscussionActions(); };
      controlsEl.appendChild(backBtn);
    }

    function askFakeSeerReport() {
      var me = players[0];
      var speakerLabel = '【' + me.title + ' ' + me.name + '】';
      addLog('【嘘の占い報告】誰について報告しますか？', 'system', '', true, null);
      addActionHint('報告したい相手のボタンを押してください。やり直す場合は戻るを押してください。');
      renderButtons(
        players.filter(function(p) { return p.alive && !p.isPlayer; }),
        function(target) {
          controlsEl.innerHTML = '';
          addLog(target.title + 'の' + target.name + 'について、どちらの嘘を報告しますか？', 'system', '', true, null);
          addActionHint('人狼だと嘘をつく、または、村人側だと嘘をつくボタンを押してください。');
          var btnWolf = document.createElement('button');
          btnWolf.type = 'button';
          btnWolf.textContent = target.title + 'の' + target.name + 'は【人狼】だと嘘をつく';
          btnWolf.onclick = function() {
            addLog(speakerLabel + '「昨晩、' + target.title + 'の' + target.name + 'を占った結果、【人狼】でした。」', 'declare-msg', '', true, me);
            dayStatements.push({
              speaker: me,
              kind: 'reportWolf',
              target: target,
              summary: me.title + ' ' + me.name + '（あなた）の占い報告（' + target.title + 'の' + target.name + 'は人狼）'
            });
            suspicionScores[target.id] += 3.5;
            showDiscussionSummaryPhase();
          };
          var btnHuman = document.createElement('button');
          btnHuman.type = 'button';
          btnHuman.className = 'secondary';
          btnHuman.textContent = target.title + 'の' + target.name + 'は【村人側】だと嘘をつく';
          btnHuman.onclick = function() {
            addLog(speakerLabel + '「昨晩、' + target.title + 'の' + target.name + 'を占った結果、【村人側（白）】でした。」', 'declare-msg', '', true, me);
            dayStatements.push({
              speaker: me,
              kind: 'reportHuman',
              target: target,
              summary: me.title + ' ' + me.name + '（あなた）の占い報告（' + target.title + 'の' + target.name + 'は村人側）'
            });
            suspicionScores[target.id] -= 2.0;
            showDiscussionSummaryPhase();
          };
          controlsEl.appendChild(btnWolf);
          controlsEl.appendChild(btnHuman);
        },
        true
      );
    }

    function showDiscussionSummaryPhase() {
      setMainChromePlacement(true);
      setBgmMood('suspense');
      addLog('=== ' + day + '日目の議論の整理 ===', 'system', '', true, null);

      var aliveList = players.filter(function(p) { return p.alive; });
      var aliveNames = aliveList.map(function(p) { return p.title + 'の' + p.name; }).join('、');

      var declaredList = aliveList.filter(function(p) { return !!p.declaredRole; });
      var declaredText = declaredList.length > 0
        ? declaredList.map(function(p) { return p.title + 'の' + p.name + '（' + p.declaredRole + '）'; }).join('、')
        : 'なし';

      var accusersMap = {};
      aliveList.forEach(function(p) {
        accusersMap[p.id] = [];
      });

      dayStatements.forEach(function(st) {
        if (!st.speaker || !st.target) return;
        if (st.kind === 'suspect' || st.kind === 'reportWolf' || st.kind === 'disagree') {
          if (accusersMap[st.target.id]) {
            if (accusersMap[st.target.id].indexOf(st.speaker.id) === -1) {
              accusersMap[st.target.id].push(st.speaker.id);
            }
          }
        }
      });

      var rankedTargets = aliveList.map(function(p) {
        return {
          player: p,
          count: (accusersMap[p.id] || []).length
        };
      }).sort(function(a, b) {
        return b.count - a.count;
      });

      var summaryLines = [
        '【生存者（' + aliveList.length + '名）】' + aliveNames,
        '【役職を名乗り出ている人物】' + declaredText,
        '【怪しいと指摘されている人数】'
      ];

      rankedTargets.forEach(function(item) {
        var label = item.player.title + 'の' + item.player.name;
        summaryLines.push('・' + label + '：' + item.count + '名');
      });

      addLog(summaryLines.join('\n'), 'summary-msg', '', true, null);

      if (players[0].alive) {
        addActionHint('議論の整理を確認したら、投票フェーズへ進むボタンを押してください。');
        controlsEl.innerHTML = '<button type="button" onclick="startVotePhase()">投票フェーズへ進む</button>';
      } else {
        addActionHint('議論の整理を確認したら、昼の投票結果を確認するボタンを押してください。');
        controlsEl.innerHTML = '<button type="button" onclick="executeVote(null)">昼の投票結果を確認する</button>';
      }
    }

    function startVotePhase() {
      setMainChromePlacement(true);
      if (!players[0].alive) {
        executeVote(null);
        return;
      }
      setBgmMood('suspense');
      pendingVoteTarget = null;
      addLog('=== ' + day + '日目の投票フェーズ ===', 'system', '', true, null);
      addLog('議論を踏まえ、誰を追放しますか？', 'system', '', true, null);
      addActionHint('追放したい人物のボタンを押してください。');
      renderButtons(
        players.filter(function(p) { return p.alive && !p.isPlayer; }),
        function(target) { showPlayerVoteSpeech(target); }
      );
    }

    function showPlayerVoteSpeech(target) {
      var me = players[0];
      if (!me.alive) {
        executeVote(null);
        return;
      }
      pendingVoteTarget = target;
      var speakerLabel = '【' + me.title + ' ' + me.name + '】';
      var targetLabel = target.title + 'の' + target.name;
      var voteSpeech = me.gender === 'female'
        ? '「私は' + targetLabel + 'に投票します。今の状況を考えると、この判断が正しいと思うわ。」'
        : pickMaleVoteLine(targetLabel);

      addLog(speakerLabel + voteSpeech, 'suspect-msg', '投票箱の前に進み、静かに決断を口にする。', true, me);
      addActionHint('投票結果を確認するボタンを押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="executeVote(pendingVoteTarget)">投票結果を確認する</button>';
    }

    function executeVote(playerChoice) {
      setMainChromePlacement(true);
      setBgmMood('suspense');
      clearLog();
      addLog('=== ' + day + '日目の投票結果 ===', 'system', '', true, null);

      if (!players[0].alive) {
        addLog('（' + players[0].name + 'は脱落しているため投票せず、生存者の投票結果を見守ります）', 'system', '', true, null);
      }

      var alivePlayers = players.filter(function(p) { return p.alive; });
      if (alivePlayers.length === 0) {
        if (evaluateGameOutcome('vote')) return;
        addActionHint('夜フェーズへ進むボタンを押してください。');
        controlsEl.innerHTML = '<button type="button" onclick="startNightPhase()">夜フェーズへ進む</button>';
        return;
      }

      var votes = {};
      alivePlayers.forEach(function(p) { votes[p.id] = 0; });

      if (players[0].alive && playerChoice && playerChoice.alive) {
        votes[playerChoice.id]++;
        addLog(players[0].title + ' ' + players[0].name + ' は ' + playerChoice.title + 'の' + playerChoice.name + ' に投票しました。', '', '', true, players[0]);
      }

      alivePlayers.filter(function(p) { return !p.isPlayer; }).forEach(function(npc) {
        var candidates = alivePlayers.filter(function(p) { return p.id !== npc.id; });
        if (candidates.length === 0) return;
        var choice = candidates[0];

        if (npc.role === '人狼') {
          var nonWolves = candidates.filter(function(p) { return p.role !== '人狼'; });
          if (nonWolves.length > 0) {
            nonWolves.sort(function(a, b) { return (suspicionScores[b.id] || 0) - (suspicionScores[a.id] || 0); });
            choice = nonWolves[0];
          }
        } else {
          candidates.sort(function(a, b) {
            var scoreA = (suspicionScores[a.id] || 0) + Math.random() * 1.5;
            var scoreB = (suspicionScores[b.id] || 0) + Math.random() * 1.5;
            return scoreB - scoreA;
          });
          choice = candidates[0];
        }

        votes[choice.id]++;
        addLog(npc.title + ' ' + npc.name + ' は ' + choice.title + 'の' + choice.name + ' に投票しました。', '', '', true, npc);
      });

      var maxVotes = -1;
      alivePlayers.forEach(function(p) {
        var count = votes[p.id] || 0;
        if (count > maxVotes) {
          maxVotes = count;
        }
      });

      var topCandidates = alivePlayers.filter(function(p) {
        return (votes[p.id] || 0) === maxVotes;
      });

      topCandidates.forEach(function(target) {
        target.alive = false;
      });

      updateStatus();

      if (topCandidates.length > 1) {
        var namesText = topCandidates.map(function(p) { return p.title + 'の' + p.name; }).join(' と ');
        addLog('投票の結果（各' + maxVotes + '票の同票）、' + namesText + ' が追放されました。', 'system', '', true, null);
        storyChronicle.push(day + '日目の昼：同票の末、' + namesText + 'が館から追放された。');
      } else if (topCandidates.length === 1) {
        var onlyExecuted = topCandidates[0];
        addLog('投票の結果（' + maxVotes + '票）、' + onlyExecuted.title + 'の' + onlyExecuted.name + ' が追放されました。', 'system', '', true, null);
        storyChronicle.push(day + '日目の昼：議論と投票により、' + onlyExecuted.title + 'の' + onlyExecuted.name + '（' + onlyExecuted.role + '）が追放された。');
      }

      topCandidates.forEach(function(banished) {
        var reaction = getBanishedReaction(banished);
        var speakerLabel = '【' + banished.title + ' ' + banished.name + '】';
        addLog(speakerLabel + reaction.line, 'suspect-msg', reaction.gesture, true, banished);
      });

      if (evaluateGameOutcome('vote')) return;
      addActionHint('夜フェーズへ進むボタンを押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="startNightPhase()">夜フェーズへ進む</button>';
    }

    function startNightPhase() {
      setMainChromePlacement(true);
      setBgmMood('night');
      clearLog();
      updateStatus();
      addLog('=== ' + day + '日目の夜フェーズ ===', 'system', '', true, null);
      var me = players[0];

      var npcSeers = players.filter(function(p) { return p.alive && !p.isPlayer && p.role === '占い師'; });
      npcSeers.forEach(function(npcSeer) {
        var targets = players.filter(function(p) { return p.alive && p.id !== npcSeer.id; });
        if (targets.length > 0) {
          var target = targets[Math.floor(Math.random() * targets.length)];
          npcSeer.lastSeerResult = { targetId: target.id, isWolf: target.role === '人狼' };
        }
      });

      if (me.alive && me.role === '占い師') {
        var seerTargets = players.filter(function(p) { return p.alive && !p.isPlayer; });
        if (seerTargets.length > 0) {
          addLog('占い師の能力：誰の正体を占いますか？', 'system', '', true, null);
          addActionHint('占いたい人物のボタンを押してください。');
          renderButtons(
            seerTargets,
            function(target) {
              clearLog();
              addLog('=== ' + day + '日目の夜フェーズ（占い結果） ===', 'system', '', true, null);
              var isWolf = target.role === '人狼';
              me.lastSeerResult = { targetId: target.id, isWolf: isWolf };
              var result = isWolf ? '【人狼】' : '【人狼ではない】';
              addLog('占いの結果、' + target.title + 'の' + target.name + ' は ' + result + ' でした。（翌日の議論で報告できます）', 'declare-msg', '', true, null);
              addActionHint('狩人の護衛・夜の出来事へ進むボタンを押してください。');
              controlsEl.innerHTML = '<button type="button" onclick="runHunterAndWolfNight(null)">狩人の護衛・夜の出来事へ進む</button>';
            }
          );
          return;
        }
      }

      if (me.alive && me.role === '狩人') {
        var guardTargets = players.filter(function(p) {
          return p.alive && p.id !== me.id && p.id !== lastGuardedTargetId;
        });
        if (guardTargets.length === 0) {
          guardTargets = players.filter(function(p) { return p.alive && p.id !== me.id; });
        }
        if (guardTargets.length > 0) {
          addLog('狩人の能力：今夜、誰を人狼の襲撃から守りますか？（連続で同じ人は守れません）', 'system', '', true, null);
          addActionHint('護衛したい人物のボタンを押してください。');
          renderButtons(
            guardTargets,
            function(target) {
              lastGuardedTargetId = target.id;
              clearLog();
              addLog('=== ' + day + '日目の夜フェーズ（護衛設定） ===', 'system', '', true, null);
              addLog('あなたは静かに身を潜め、' + target.title + 'の' + target.name + ' を今夜の護衛対象に選びました。', 'declare-msg', '', true, null);
              addActionHint('夜の出来事へ進むボタンを押してください。');
              controlsEl.innerHTML = '<button type="button" onclick="runHunterAndWolfNight(' + target.id + ')">夜の出来事へ進む</button>';
            }
          );
          return;
        }
      }

      addLog('静まり返った館の中で、それぞれの夜が更けていく。', 'system', '', true, null);
      addActionHint('夜の出来事へ進むボタンを押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="runHunterAndWolfNight(null)">夜の出来事へ進む</button>';
    }

    function runHunterAndWolfNight(playerGuardedId) {
      setMainChromePlacement(true);
      setBgmMood('night');
      var guardedTargetId = playerGuardedId;

      if (guardedTargetId === null || guardedTargetId === undefined) {
        var npcHunter = players.find(function(p) { return p.alive && !p.isPlayer && p.role === '狩人'; });
        if (npcHunter) {
          var candidates = players.filter(function(p) {
            return p.alive && p.id !== npcHunter.id && p.id !== lastGuardedTargetId;
          });
          if (candidates.length === 0) {
            candidates = players.filter(function(p) { return p.alive && p.id !== npcHunter.id; });
          }
          if (candidates.length > 0) {
            var declaredKeyRole = candidates.filter(function(p) {
              return p.declaredRole === '占い師' || p.declaredRole === '狩人';
            });
            var chosen = declaredKeyRole.length > 0 && Math.random() < 0.75
              ? declaredKeyRole[Math.floor(Math.random() * declaredKeyRole.length)]
              : candidates[Math.floor(Math.random() * candidates.length)];
            guardedTargetId = chosen.id;
            lastGuardedTargetId = chosen.id;
          }
        }
      }

      var aliveWolves = players.filter(function(p) { return p.alive && p.role === '人狼'; });
      if (aliveWolves.length > 0) {
        var targets = players.filter(function(p) { return p.alive && p.role !== '人狼'; });
        if (targets.length > 0) {
          var playerIsWolf = aliveWolves.some(function(w) { return w.isPlayer; });
          if (playerIsWolf) {
            clearLog();
            addLog('=== ' + day + '日目の夜フェーズ（襲撃） ===', 'system', '', true, null);
            addLog('人狼の能力：今夜、誰を襲撃しますか？', 'system', '', true, null);
            addActionHint('襲撃したい人物のボタンを押してください。');
            renderButtons(targets, function(target) {
              clearLog();
              addLog('=== ' + day + '日目の夜明け ===', 'system', '', true, null);
              addLog('闇に紛れて' + target.title + 'の' + target.name + ' が襲撃されました。', 'system', '', true, null);
              if (guardedTargetId === target.id) {
                addLog('しかし、狩人の護衛によって襲撃は阻まれ、' + target.title + 'の' + target.name + ' は無事に生き延びました！', 'declare-msg', '', true, null);
                storyChronicle.push(day + '日目の夜：人狼が' + target.title + 'の' + target.name + 'を襲ったが、狩人の護衛によって阻止された。');
              } else {
                target.alive = false;
                addLog(formatVictimDiscovery(target), 'system', '', true, null);
                storyChronicle.push(day + '日目の夜：闇の中で' + target.title + 'の' + target.name + '（' + target.role + '）が人狼の犠牲となった。');
              }
              day++;
              updateStatus();
              if (evaluateGameOutcome('night')) return;
              addActionHint(day + '日目の昼へ進むボタンを押してください。');
              controlsEl.innerHTML = '<button type="button" onclick="startDayPhase()">' + day + '日目の昼へ進む</button>';
            });
            return;
          } else {
            clearLog();
            addLog('=== ' + day + '日目の夜明け ===', 'system', '', true, null);
            var declaredSeers = targets.filter(function(p) { return p.declaredRole === '占い師'; });
            var victim = declaredSeers.length > 0 && Math.random() < 0.7
              ? declaredSeers[0]
              : targets[Math.floor(Math.random() * targets.length)];
            if (victim) {
              if (guardedTargetId === victim.id) {
                addLog('今夜は人狼が' + victim.title + 'の' + victim.name + 'を襲撃しようとしましたが、狩人の護衛によって犠牲者は出ませんでした！', 'declare-msg', '', true, null);
                storyChronicle.push(day + '日目の夜：人狼が' + victim.title + 'の' + victim.name + 'を狙ったが、狩人の護衛が成功し犠牲者は出なかった。');
              } else {
                victim.alive = false;
                addLog(formatVictimDiscovery(victim), 'system', '', true, null);
                storyChronicle.push(day + '日目の夜：' + victim.title + 'の' + victim.name + '（' + victim.role + '）が人狼に襲われ命を落とした。');
              }
            }
          }
        }
      }
      day++;
      updateStatus();
      if (evaluateGameOutcome('night')) return;
      addActionHint(day + '日目の昼へ進むボタンを押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="startDayPhase()">' + day + '日目の昼へ進む</button>';
    }

    function evaluateGameOutcome(phase) {
      setMainChromePlacement(true);
      var aliveWolves = players.filter(function(p) { return p.alive && p.role === '人狼'; });
      var aliveHumans = players.filter(function(p) { return p.alive && p.role !== '人狼'; });
      var wolves = aliveWolves.length;
      var humans = aliveHumans.length;
      var playerIsWolf = players[0] && players[0].role === '人狼';

      if (wolves === 0) {
        var villageReason = phase === 'vote'
          ? 'この追放によって、館に潜んでいた【人狼】がいなくなりました（生存者：人狼 0人 ／ 村人側 ' + humans + '人）。'
          : '館に潜んでいた【人狼】がいなくなりました（生存者：人狼 0人 ／ 村人側 ' + humans + '人）。';

        addLog('【決着】' + villageReason, 'declare-msg', '', true, null);

        pendingEndInfo = {
          winnerSide: 'village',
          resultMessage: '人狼は追放され、館に平穏が戻りました。【村人陣営の勝利】です。',
          mood: playerIsWolf ? 'defeat' : 'victory',
          isPlayerWin: !playerIsWolf
        };
        addActionHint('状況を確認したら、エンディングへ進むボタンを押してください。');
        controlsEl.innerHTML = '<button type="button" onclick="showEndingStory()">エンディングへ進む</button>';
        return true;
      }

      if (wolves >= humans) {
        var isLastVillagerFall = humans > 0 && day >= 2;
        if (isLastVillagerFall) {
          setBgmMood('despair');
        }

        var wolfReason = '';
        if (phase === 'vote') {
          wolfReason = humans === 0
            ? 'この追放によって生存している村人側がいなくなり、館は【人狼】に制圧されました。'
            : 'この追放によって生存者が「人狼 ' + wolves + '人 対 村人側 ' + humans + '人」となり、もはや人狼を止める術はありません。';
        } else if (phase === 'night') {
          wolfReason = 'この襲撃によって生存者が「人狼 ' + wolves + '人 対 村人側 ' + humans + '人」となり、もはや人狼を止める術はありません。';
        } else {
          wolfReason = '生存者が「人狼 ' + wolves + '人 対 村人側 ' + humans + '人」となり、人狼陣営の勝利条件が満たされました。';
        }

        addLog('【決着】' + wolfReason, 'suspect-msg', '', true, null);

        if (humans > 0) {
          var remainingWolf = aliveWolves[0];
          aliveHumans.forEach(function(lastVictim) {
            lastVictim.alive = false;
            var victimLabel = lastVictim.title + 'の' + lastVictim.name;
            var wolfLabel = remainingWolf ? (remainingWolf.title + 'の' + remainingWolf.name) : '人狼';
            var finalAttackText = lastVictim.isPlayer
              ? '扉は閉ざされ、逃げ場はもうどこにもありません。正体を現した' + wolfLabel + 'が冷たい息を吐きながら迫り、最後の村人となった' + victimLabel + 'は絶望の中、闇へと引きずり込まれました。'
              : '扉は閉ざされ、逃げ場はもうどこにもありません。正体を現した' + wolfLabel + 'が鋭い牙を剥き、最後の村人だった' + victimLabel + 'は絶望の中、闇へと引きずり込まれました。';
            addLog(finalAttackText, 'suspect-msg', '逃げ場のない館に恐怖と絶望が満ち、灯りが消えた闇から低い唸り声が響く。', true, null);
          });
          updateStatus();
        }

        pendingEndInfo = {
          winnerSide: 'wolf',
          resultMessage: '生き残った人々は人狼の牙に倒れました。【人狼陣営の勝利】です。',
          mood: playerIsWolf ? 'victory' : 'defeat',
          isPlayerWin: playerIsWolf
        };
        addActionHint('状況を確認したら、エンディングへ進むボタンを押してください。');
        controlsEl.innerHTML = '<button type="button" onclick="showEndingStory()">エンディングへ進む</button>';
        return true;
      }

      return false;
    }

    function showEndingStory() {
      if (!pendingEndInfo) return;
      setMainChromePlacement(true);
      setBgmMood('ending');
      clearLog();

      var wolfMembers = players.filter(function(p) { return p.role === '人狼'; });
      var wolfNames = wolfMembers.map(function(w) { return w.title + 'の' + w.name; }).join('、');
      var survivors = players.filter(function(p) { return p.alive; });
      var survivorNames = survivors.length > 0
        ? survivors.map(function(s) { return s.title + 'の' + s.name; }).join('、')
        : '誰も残らなかった';

      addLog('=== エンディング：閉ざされた館の記憶 ===', 'system', '', true, null);

      addLog(
        '吹雪に閉ざされた古い館に集まった' + players.length + '人。疑心と偽りが交錯する日々の中で、それぞれの言葉と選択が運命を分かつことになりました。',
        'ending-msg',
        '静かなピアノと弦の調べが、館の長い夜を包み込む。',
        true,
        null
      );

      if (storyChronicle.length > 0) {
        addLog('--- 館で起きた出来事の振り返り ---', 'system', '', true, null);
        storyChronicle.forEach(function(entry) {
          addLog('・' + entry, 'ending-msg', '', true, null);
        });
      }

      if (pendingEndInfo.winnerSide === 'village') {
        addLog(
          '館の闇に潜んでいた人狼は、' + wolfNames + 'でした。人々は互いの言葉を見極め、ついに偽りの仮面を打ち破ったのです。',
          'ending-msg',
          '',
          true,
          null
        );
        addLog(
          'やがて夜明けとともに吹雪は止み、重い館の扉が開かれました。生き残った' + survivorNames + 'は、深い安堵とともに朝の光の中へと踏み出していきます。',
          'ending-msg',
          '',
          true,
          null
        );
      } else {
        addLog(
          '最後まで人々の目を欺き通した人狼の正体は、' + wolfNames + 'でした。疑念の渦の中で村人たちは判断を誤り、館の支配権は闇へと渡ったのです。',
          'ending-msg',
          '',
          true,
          null
        );
        addLog(
          '吹雪が降り続く古い館には、もはや人の声は響きません。すべてを飲み込んだ静寂だけが、いつまでも残り続けました。',
          'ending-msg',
          '',
          true,
          null
        );
      }

      addActionHint('物語を振り返ったら、結果発表へ進むボタンを押してください。');
      controlsEl.innerHTML = '<button type="button" onclick="proceedToFinalResult()">結果発表へ進む</button>';
    }

    function proceedToFinalResult() {
      if (!pendingEndInfo) return;
      var info = pendingEndInfo;
      pendingEndInfo = null;
      endGame(info.resultMessage, info.mood, info.isPlayerWin);
    }

    function endGame(resultMessage, mood, isPlayerWin) {
      setMainChromePlacement(true);
      screenState = 'ended';
      setBgmMood(mood || 'victory');
      if (isPlayerWin) {
        playVictorySe();
      }
      clearLog();
      updateStatus();
      addLog('=== 結果発表 ===', 'system', '', true, null);
      addLog(resultMessage, 'system', '', true, null);
      addLog('--- すべての参加者の正体 ---', 'system', '', true, null);
      players.forEach(function(p) {
        addLog(p.title + ' ' + p.name + '：正体は【' + p.role + '】 (' + (p.alive ? '生存' : '脱落') + ')', '', '', true, null);
      });
      addActionHint('オープニング画面に戻るボタンを押すか、エンターキーを押してください。');
      returnBannerEl.style.display = 'block';
      controlsEl.innerHTML = '<button type="button" onclick="returnToOpeningScreen()">オープニング画面に戻る</button>';
    }

    function renderButtons(targetList, callback, allowBack) {
      if (allowBack === undefined) allowBack = false;
      controlsEl.innerHTML = '';
      targetList.forEach(function(target) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = target.title + ' ' + target.name;
        btn.onclick = function() { callback(target); };
        controlsEl.appendChild(btn);
      });
      if (allowBack) {
        var backBtn = document.createElement('button');
        backBtn.type = 'button';
        backBtn.className = 'secondary';
        backBtn.textContent = '戻る';
        backBtn.onclick = function() { showPlayerDiscussionActions(); };
        controlsEl.appendChild(backBtn);
      }
    }

    updateAudioButtonsUI();
  </script>
</body>
</html>
